<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>To Do</title>
<meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151514" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="To Do">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --bg:#f6f5f1; --card:#ffffff; --side:#fbfaf7; --ink:#1b1b19; --muted:#7a786f; --line:#e6e3da; --hover:#f0eee8;
  --accent:#1f7a4d; --accent-soft:#e3f1e9; --late:#b4532a; --late-soft:#f8e9e1; --danger:#b42a2a;
  --agent:#5b3fd1; --agent-soft:#ece8fb; --warn:#9a6a00; --warn-soft:#fbf1d6;
  --radius:14px; --shadow:0 1px 2px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#151514; --card:#1f1f1d; --side:#191918; --ink:#efede6; --muted:#9a978d; --line:#2e2d2a; --hover:#262624;
  --accent:#4cc38a; --accent-soft:#1d3428; --late:#e4885d; --late-soft:#3a261c; --danger:#e46b6b;
  --agent:#ab9cff; --agent-soft:#2a2540; --warn:#e2b54f; --warn-soft:#3a3020; --shadow:none;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
body{min-height:100dvh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button{font:inherit}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}

/* ---------- Mise en page ---------- */
.app{min-height:100dvh}
.side,.aside{display:none}
.main{max-width:680px;margin:0 auto;padding:16px 16px 120px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0 14px}
header.top h1{font-size:28px;letter-spacing:-.02em;margin:0;font-weight:700}
.sub{color:var(--muted);font-size:14px}
.hright{display:flex;align-items:center;gap:8px}
.hbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:13.5px;cursor:pointer}
.avatar{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:700;font-size:13px;cursor:pointer;flex:none}
@media (min-width:980px){
  .app{display:grid;grid-template-columns:252px minmax(0,1fr);}
  .side{display:flex;flex-direction:column;position:sticky;top:0;height:100dvh;overflow:auto;background:var(--side);border-right:1px solid var(--line);padding:18px 12px 14px}
  .main{max-width:920px;width:100%;padding:28px 40px 80px}
  .mob{display:none !important}
  header.top h1{font-size:26px}
}
@media (max-width:979px){.desk{display:none !important}}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 16px}
.brand b{font-size:19px;letter-spacing:-.01em}
.brand .lg{width:28px;height:28px;border-radius:8px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800}
.snav{display:flex;flex-direction:column;gap:2px}
.snav button,.sproj button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;color:var(--ink);text-align:left;border-radius:9px;padding:8px 10px;font-size:14.5px;cursor:pointer}
.snav button:hover,.sproj button:hover{background:var(--hover)}
.snav button.on,.sproj button.on{background:var(--card);box-shadow:0 0 0 1px var(--line);font-weight:600}
.snav .ic{width:18px;text-align:center;color:var(--muted)}
.snav .n,.sproj .n{margin-left:auto;color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
.snav .n.hot{color:#fff;background:var(--late);border-radius:999px;padding:0 7px;font-weight:600}
.stitle{display:flex;align-items:center;justify-content:space-between;margin:20px 10px 6px;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stitle button{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:16px;line-height:1;padding:0 2px}
.sproj{display:flex;flex-direction:column;gap:1px}
.sproj .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.swho{display:flex;gap:4px;margin:0 6px}
.swho button{flex:1;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:8px;padding:6px 4px;font-size:13px;cursor:pointer}
.swho button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.swho button.on.ag{background:var(--agent);border-color:var(--agent);color:#fff}
.sfoot{margin-top:auto;padding-top:14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.acct{display:flex;align-items:center;gap:10px;border:0;background:transparent;color:var(--ink);border-radius:10px;padding:8px;cursor:pointer;text-align:left;width:100%}
.acct:hover{background:var(--hover)}
.acct .em{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- Bandeau, ajout ---------- */
.banner{display:flex;gap:10px;align-items:center;background:var(--warn-soft);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13.5px;margin-bottom:12px}
.banner b{color:var(--warn)}
.banner button{margin-left:auto;flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:6px 10px;font-size:13px;cursor:pointer}
.add{display:flex;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:6px 6px 6px 14px;box-shadow:var(--shadow)}
.add input{flex:1;border:0;background:transparent;color:var(--ink);font:inherit;font-size:17px;outline:none;min-width:0}
.add button{border:0;background:var(--accent);color:#fff;border-radius:10px;width:40px;height:40px;font-size:22px;cursor:pointer;flex:none}
.add .mic{background:var(--accent-soft);color:var(--accent)}
.add .mic svg{width:20px;height:20px;vertical-align:middle}
.add .mic.rec{background:#d64545;color:#fff;animation:pulse 1.4s infinite}
.add .mic.busy{opacity:.6}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(214,69,69,.45)}70%{box-shadow:0 0 0 12px rgba(214,69,69,0)}100%{box-shadow:0 0 0 0 rgba(214,69,69,0)}}
.opts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
#addZone{position:relative;z-index:6}
.addpop{display:none;position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;box-shadow:0 8px 24px rgba(0,0,0,.12)}
#addZone.focus .addpop{display:block}
.seg button.on.ur{background:var(--late);color:#fff}
.seg button.on.lo{background:var(--muted);color:var(--bg)}
.fab{position:fixed;right:18px;bottom:calc(22px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:30px;line-height:1;box-shadow:0 6px 18px rgba(0,0,0,.22);z-index:15;cursor:pointer}
.qadd{display:flex;gap:8px;align-items:center}
.qadd input{flex:1;font-size:17px !important}
.qadd .mic{flex:none;width:44px;height:44px;border:0;border-radius:12px;background:var(--accent-soft);color:var(--accent);cursor:pointer}
.qadd .mic svg{width:20px;height:20px;vertical-align:middle}
.qadd .mic.rec{background:#d64545;color:#fff;animation:pulse 1.4s infinite}
.chips button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips button.on.ur{background:var(--late);border-color:var(--late);color:#fff}
.qrow{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}
.qrow .ql{font-size:12.5px;color:var(--muted);width:100%}
.opt{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:0 10px;min-height:34px;font-size:13.5px;max-width:100%}
.opt select,.opt input{border:0;background:transparent;color:inherit;font:inherit;font-size:13.5px;outline:none;padding:0;min-width:0;max-width:170px}
.opt input[type=date]{max-width:132px}
.opt .lbl{color:var(--muted)}
.seg{display:inline-flex;flex:none;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:transparent;color:var(--muted);font-size:13.5px;padding:0 12px;min-height:32px;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--ink);color:var(--bg)}
.seg button.on.ag{background:var(--agent);color:#fff}
.hint{color:var(--muted);font-size:12.5px;margin:6px 4px 0}

/* ---------- Navigation mobile ---------- */
nav.tabs{display:flex;gap:6px;margin:18px 0 10px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:7px 14px;font-size:14px;white-space:nowrap;cursor:pointer;flex:none}
nav.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
nav.tabs .n{opacity:.7;margin-left:4px;font-variant-numeric:tabular-nums}
nav.tabs .n.hot{opacity:1;color:#fff;background:var(--late);border-radius:999px;padding:0 6px}
.pfilter{display:flex;gap:6px;overflow-x:auto;margin:0 0 10px;padding-bottom:2px;scrollbar-width:none;align-items:center}
.pfilter::-webkit-scrollbar{display:none}
.pfilter .pf{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:10px;padding:0 10px;min-height:32px;font-size:13px;cursor:pointer;white-space:nowrap}
.pfilter .pf.on{border-color:var(--ink);color:var(--ink);background:var(--card);font-weight:600}
.pfilter .n{opacity:.7;font-variant-numeric:tabular-nums}
.pfilter .sep{flex:none;width:1px;height:20px;background:var(--line);margin:0 2px}
.vhead{display:none}
@media (min-width:980px){.vhead{display:flex;align-items:baseline;gap:10px;margin:26px 0 12px}.vhead h2{margin:0;font-size:18px}.vhead .sub{font-size:13.5px}}

/* ---------- Liste ---------- */
.search{display:none;margin:12px 0 10px}
.search.on{display:block}
.search input{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 12px;font:inherit}
ul{list-style:none;margin:0;padding:0}
li{position:relative;margin-bottom:6px;border-radius:12px;overflow:hidden}
.bgL,.bgR{opacity:0;position:absolute;inset:0;display:flex;align-items:center;padding:0 18px;font-weight:600;font-size:14px;color:#fff}
.bgR{background:var(--accent)} .bgL{background:#5b6b8a;justify-content:flex-end}
.row{position:relative;display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 10px 9px 12px;box-shadow:var(--shadow);touch-action:pan-y;transition:transform .18s ease}
.row.urg{box-shadow:inset 3px 0 0 var(--late)}
@media (min-width:980px){.row{padding:9px 12px}.row:hover{border-color:var(--muted)}}
.check{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer;padding:0;display:grid;place-items:center;align-self:center;opacity:.55;transition:opacity .15s,background .15s}
.check svg{width:20px;height:20px}
.check:hover,.check:focus-visible{opacity:1;background:var(--accent-soft)}
.done .check{opacity:1;background:var(--accent);color:#fff}
li.lift{z-index:4;overflow:visible;transition:none}
li.lift .row{box-shadow:0 10px 26px rgba(0,0,0,.22);cursor:grabbing;border-color:var(--accent)}
li.lift .bgL,li.lift .bgR{display:none}
.body{flex:1;min-width:0;cursor:pointer}
.title{word-wrap:break-word;font-size:15px;line-height:1.3;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
@media (min-width:980px){.title{-webkit-line-clamp:3}}
.done .title{color:var(--muted);text-decoration:line-through}
.meta{display:flex;flex-wrap:nowrap;gap:8px;margin-top:3px;font-size:12px;color:var(--muted);overflow:hidden;white-space:nowrap;align-items:center}
.meta>span{flex:none;max-width:60%;overflow:hidden;text-overflow:ellipsis}
.meta>span.shrink{flex:0 1 auto;min-width:0}
.pill{display:inline-block;border-radius:5px;padding:0 6px;font-weight:700;font-size:11.5px;line-height:17px}
.pill.u{background:var(--late-soft);color:var(--late)}
.pill.f{background:var(--hover);color:var(--muted)}
.tg{display:inline-block;border:1px solid var(--line);border-radius:5px;padding:0 5px;line-height:16px;font-size:11.5px}
.src{opacity:.75}
.meta .late{color:var(--late);font-weight:600}
.meta .auto{color:var(--accent)}
.ptag{display:inline-flex;align-items:center;gap:5px}
.agtag{display:inline-flex;align-items:center;gap:4px;color:var(--agent);background:var(--agent-soft);border-radius:6px;padding:0 6px;font-weight:600}
.tlink{display:block;margin-top:6px;font-size:13px;color:var(--accent);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tlink:hover{text-decoration:underline}
.donebtn{background:var(--accent) !important;border-color:var(--accent) !important;color:#fff !important;font-weight:700}
.sheethead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 12px;min-height:36px}
.sheethead h3{margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.actions.foot button:not(.primary):not(.ghost):not(.danger){border:1px solid var(--line);background:transparent}
.sheethead h3{margin:0}
.sheethead .donebtn{border:1px solid;border-radius:999px;padding:8px 16px;font-size:15px;cursor:pointer}
.ntools{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 6px}
.ntools button,.ntools label{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;min-width:36px;height:34px;padding:0 10px;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.ntools input{display:none}
.rich{min-height:90px;max-height:40dvh;overflow:auto;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px;font-size:15px;line-height:1.45;outline:none;word-wrap:break-word}
.rich:empty::before{content:attr(data-ph);color:var(--muted)}
.rich ul{margin:4px 0;padding-left:22px;list-style:disc}
.rich li{display:list-item;overflow:visible;margin:0;border-radius:0;position:static}
.panel .ntools label{display:inline-flex;margin:0;color:var(--ink);font-size:14px}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin-top:8px}
.file{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg);aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:11.5px;color:var(--ink);text-decoration:none;padding:6px}
.file img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.file .fi{font-size:26px;line-height:1;margin-bottom:4px}
.file .fn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.file .fx{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:13px;cursor:pointer;z-index:2}
.file.up{opacity:.5}
.moverow{display:flex;gap:6px;flex-wrap:wrap}
.more{flex:none;border:0;background:transparent;color:var(--muted);font-size:18px;cursor:pointer;padding:0 2px;line-height:20px}
.fbar{display:flex;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:none;margin:0 0 10px}
.fbar::-webkit-scrollbar{display:none}
.fbar button{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:0 12px;min-height:32px;font-size:13px;cursor:pointer;white-space:nowrap}
.fbar button.on{border-color:var(--ink);color:var(--ink);background:var(--card);font-weight:600}
.fbar .x{opacity:.6;margin-left:2px}
.stags{display:flex;flex-wrap:wrap;gap:4px;margin:0 6px}
.stags button{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:7px;padding:3px 8px;font-size:12.5px;cursor:pointer}
.stags button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.orig{font-size:13px;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:4px;word-wrap:break-word}
.empty{color:var(--muted);text-align:center;padding:48px 16px}
/* ---------- Sections ---------- */
li.sechead{display:flex;align-items:center;gap:6px;margin:18px 2px 6px;overflow:visible;border-radius:0;padding-bottom:4px;border-bottom:1px solid var(--line)}
ul > li.sechead:first-child{margin-top:4px}
.sechead .sn{font-weight:700;font-size:14.5px;letter-spacing:.01em;flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sechead .sc{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;flex:1}
.sechead button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:18px;line-height:1;width:34px;height:34px;border-radius:8px;cursor:pointer}
.sechead button:hover,.sechead button:focus-visible{background:var(--card);color:var(--ink)}
.grip{flex:none;align-self:center;display:grid;gap:4px;padding:10px 4px 10px 8px;margin-right:-4px;cursor:grab;touch-action:none;opacity:.45}
.grip i{display:block;width:14px;height:2px;border-radius:2px;background:var(--muted)}
.row:hover .grip,.grip:focus-visible{opacity:.9}
li.lift .grip{cursor:grabbing;opacity:1}
.sechead .stog{display:flex;align-items:center;gap:6px;flex:1;min-width:0;width:auto;height:auto;padding:4px 2px;border-radius:8px;color:var(--ink);font:inherit;text-align:left}
.sechead .chev{font-size:12px;color:var(--muted);transition:transform .15s}
.sechead.shut .chev{transform:rotate(-90deg)}
.lsearch{position:relative;margin:0 0 12px}
.stabs{display:flex;align-items:center;gap:6px;margin:0 0 12px;overflow-x:auto;scrollbar-width:none;padding:2px}
.stabs::-webkit-scrollbar{display:none}
.stab{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:background .12s,border-color .12s,transform .12s}
.stab span{font-weight:500;color:var(--muted);margin-left:2px;font-variant-numeric:tabular-nums}
.stab.on{background:var(--ink);border-color:var(--ink);color:var(--card)}
.stab.on span{color:inherit;opacity:.7}
.stab.drop{border-color:var(--accent);background:var(--accent-soft);color:var(--ink);transform:scale(1.04)}
.stabs .grow{flex:1}
.stabs{position:sticky;top:0;z-index:6;background:var(--bg);margin-left:-4px;margin-right:-4px;padding:8px 4px}
.stab b{font-weight:inherit}
.stab .sm{display:none}
@media (max-width:600px){.stab .lg{display:none}.stab .sm{display:inline}.stab{padding:8px 12px}#secAdd{display:none}
.mailbar .msub{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;max-width:100%}.mailbar .msub::-webkit-scrollbar{display:none}.mailbar .msub button{flex:none}
.mailbar{flex-wrap:wrap}.mmeta{gap:4px 12px}}
.sbtn{flex:none;border:0;background:transparent;color:var(--muted);width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer}
.sbtn:hover{background:var(--hover);color:var(--ink)}
.fchips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.fchips button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.fchips button span{color:var(--muted);margin-left:2px;font-variant-numeric:tabular-nums}
.fchips button.on{background:var(--ink);border-color:var(--ink);color:var(--card)}
.fchips button.on span{color:inherit;opacity:.7}
.lsearch input{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:9px 36px 9px 34px;font:inherit;font-size:14px}
.lsearch input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.lsearch .lsi{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);display:flex}
.lsearch input::-webkit-search-cancel-button{display:none}
.lsearch .lsx{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--muted);width:28px;height:28px;border-radius:50%;cursor:pointer}
.lsearch .lsx:hover{background:var(--hover);color:var(--ink)}

<body>
<div id="app"></div>
<div class="sheet" id="sheet"><div class="panel" id="panel"></div></div>
<div class="toast" id="toast"><span id="toastMsg"></span><button id="toastUndo">Annuler</button></div>

<script>
const API = "https://rorwnacthttwxyqemkgv.supabase.co/functions/v1/todo-api";
const DAPI = "https://rorwnacthttwxyqemkgv.supabase.co/functions/v1/todo-delegate";
const APP = location.href.split("#")[0].split("?")[0];
const store = {
  get(k){ try{ return localStorage.getItem(k) }catch{ return null } },
  set(k,v){ try{ localStorage.setItem(k,v) }catch{} },
  del(k){ try{ localStorage.removeItem(k) }catch{} },
};
let token = store.get("todo_token");
let meInfo = null;
let view = store.get("todo_view") || "today";
if (view === "later") view = "today";
let sections = [], tasks = [], counts = {today:0,open:0,done:0,mail:0}, searching = false, overview = null, projects = [];
let fProject = store.get("todo_fproject") || "", fWho = store.get("todo_fwho") || "", newWho = "moi";
let mailData = null, mailTab = "nouveau", mView = (() => { try { return store.get("todo_mview") || "todo"; } catch { return "todo"; } })();
let mailPending = +(store.get("todo_mail_refresh") || 0), mailPoll = null;
let fTag = store.get("todo_ftag") || "", newPri = "moyen", tagList = [], capStart = 0;
const PRIS = [["faible","Faible"],["moyen","Moyen"],["urgent","Urgent"]];
const PALETTE = ["#1f8a9a","#2f8f5b","#6a4fd6","#c2417a","#c27a1f","#3b6fd1","#8a5a2b","#5b6b8a"];
const HINT = "Astuces : demain, vendredi, 15/10 · #projet · @agent pour confier à l'IA";
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const safeUrl = u => typeof u === "string" && /^https:\/\//.test(u);
const projById = id => projects.find(p => p.id === id);
const AGENT_LABEL = n => n === "claude" ? "Claude" : n === "chatgpt" ? "ChatGPT" : "Agent IA";
const isWide = () => matchMedia("(min-width:980px)").matches;
const legacy = () => !!meInfo?.legacy;

async function api(path, opts = {}){
  const headers = { "Content-Type": "application/json" };
  if (token) headers.Authorization = "Bearer " + token;
  const r = await fetch((opts.base || API) + path, { ...opts, headers });
  const data = await r.json().catch(() => ({}));
  if (r.status === 401 && token && !path.startsWith("/auth/")) { token = null; store.del("todo_token"); meInfo = null; showLogin("Session expirée, reconnecte-toi."); }
  if (!r.ok) throw Object.assign(new Error(data.error || "Erreur réseau"), { status: r.status, data });
  return data;
}

const dapi = (path, opts = {}) => api(path, { ...opts, base: DAPI });

// ---------- Dates ----------
const todayISO = (o=0) => new Date(Date.now()+o*864e5).toLocaleDateString("en-CA");
function nextWeekday(target){ const w = new Date().getDay(); const d = (target - w + 7) % 7; return todayISO(d || 7); }
function fmtDue(iso){
  if (!iso) return "";
  const t = todayISO(0);
  if (iso < t) { const n = Math.round((Date.parse(t) - Date.parse(iso)) / 864e5); return `<span class="late">En retard de ${n} j</span>`; }
  if (iso === t) return "Aujourd'hui";
  if (iso === todayISO(1)) return "Demain";
  const diff = (Date.parse(iso) - Date.parse(t)) / 864e5;
  const s = new Date(iso + "T12:00:00").toLocaleDateString("fr-BE", diff < 7 ? { weekday:"long" } : { day:"numeric", month:"short" });
  return s.charAt(0).toUpperCase() + s.slice(1);
}
function fmtAgo(ts){
  const m = Math.round((Date.now() - Date.parse(ts)) / 6e4);
  if (m < 60) return `il y a ${Math.max(m,1)} min`;
  const h = Math.round(m/60); if (h < 24) return `il y a ${h} h`;
  const d = Math.round(h/24); if (d < 7) return `il y a ${d} j`;
  return new Date(ts).toLocaleDateString("fr-BE", { day:"numeric", month:"short" });
}

// ---------- Connexion ----------
function readHash(){
  const h = new URLSearchParams(location.hash.slice(1));
  const msg = {};
  if (h.get("session")) { token = h.get("session"); store.set("todo_token", token); }
  if (h.get("auth_error")) msg.auth = h.get("auth_error");
  if (h.get("mail") === "connected") msg.mail = "Boîte mail connectée";
  if (h.get("mail_error")) msg.mailErr = h.get("mail_error");
  if (location.hash) history.replaceState(null, "", APP);
  return msg;
}
async function showLogin(err){
  let prov = { google:false, microsoft:false };
  try { prov = await (await fetch(API + "/auth/providers")).json(); } catch {}
  const red = encodeURIComponent(APP);
  closeSheet();
  $("#app").innerHTML = `<div class="login">
    <h1>To Do</h1><p>Tes tâches, tes mails à traiter et les clôtures à valider.</p>
    ${prov.google ? `<button class="lbtn" id="lg">Continuer avec Google</button>` : ""}
    ${prov.microsoft ? `<button class="lbtn" id="lm">Continuer avec Microsoft</button>` : ""}
    ${prov.google || prov.microsoft ? `<div class="or">ou</div>` : ""}
    <form id="kf"><input id="k" placeholder="Clé d'accès (todo_…)" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button class="go">Se connecter avec ma clé</button></form>
    <div class="err" id="lerr">${esc(err || "")}</div>
    <div class="note">${prov.google || prov.microsoft ? "" : "Connexion avec Google et Microsoft pas encore configurée : utilise ta clé d'accès personnelle."}</div>
  </div>`;
  if ($("#lg")) $("#lg").onclick = () => location.href = `${API}/auth/google/start?redirect=${red}`;
  if ($("#lm")) $("#lm").onclick = () => location.href = `${API}/auth/microsoft/start?redirect=${red}`;
  $("#kf").onsubmit = async e => {
    e.preventDefault(); const key = $("#k").value.trim(); if (!key) return;
    try { const r = await api("/auth/key", { method:"POST", body: JSON.stringify({ key }) }); token = r.session; store.set("todo_token", token); boot(); }
    catch(x){ $("#lerr").textContent = x.status === 401 ? "Clé non reconnue." : x.message; }
  };
}
async function logout(){
  try { await api("/auth/logout", { method:"POST", body:"{}" }); } catch {}
  token = null; store.del("todo_token"); meInfo = null; closeSheet(); showLogin();
}

// ---------- Squelette ----------
function initials(){ return (meInfo?.user?.name || meInfo?.user?.email || "?").split(/[\s@.]+/).filter(Boolean).slice(0,2).map(s => s[0].toUpperCase()).join(""); }

  $("#app").innerHTML = `<div class="app">
    <aside class="side" id="side"></aside>
    <main class="main">
      <header class="top"><div><h1>Klaar</h1><div class="sub">${d}</div></div>
        <div class="hright"><button class="hbtn" id="sumBtn">Résumé</button><button class="avatar mob" id="acctBtn" aria-label="Compte">${legacy() ? "?" : esc(initials())}</button></div></header>
      <div id="banner"></div>
      <div id="addZone" class="desk">
        <form class="add" id="add"><input id="new" placeholder="Nouvelle tâche…" enterkeyhint="done" autocomplete="off">
          <button type="button" class="mic" id="mic" aria-label="Dicter des tâches"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
          <button type="submit" aria-label="Ajouter">+</button></form>
        <div class="addpop"><div class="opts">
          <label class="opt"><span class="dot" id="nProjDot" style="background:var(--line)"></span><select id="nProj" aria-label="Projet de la nouvelle tâche"></select></label>
          <div class="seg" id="nWho" role="group" aria-label="Qui fait la tâche"><button type="button" data-w="moi" class="on">Moi</button><button type="button" data-w="agent" class="ag">Agent IA</button></div>
          <div class="seg" id="nPri" role="group" aria-label="Urgence">${PRIS.map(([k,l]) => `<button type="button" data-p="${k}" class="${k==="moyen"?"on":""} ${k==="urgent"?"ur":k==="faible"?"lo":""}">${l}</button>`).join("")}</div>
          <label class="opt"><span class="lbl">Échéance</span><input type="date" id="nDue" aria-label="Échéance"></label>
        </div>
        <div class="hint" id="hint">${HINT}</div></div>
      </div>
      <nav class="tabs mob" id="tabs"></nav>
      <div class="fbar mob" id="pfilter"></div>
      <div class="vhead" id="vhead"></div>
      <div class="search" id="searchBox"><input id="q" type="search" placeholder="Rechercher dans toutes les tâches"></div>
      <div class="asksWrap" id="asks"></div>
      <div id="content"></div>
    </main>
    <button class="fab mob" id="fab" aria-label="Nouvelle tâche">+</button>
  </div>`;
  $("#add").onsubmit = onAdd;
  $("#new").addEventListener("focus", () => { $("#addZone").classList.add("focus"); if (!capStart) capStart = Date.now(); });
  document.addEventListener("pointerdown", e => { const z = $("#addZone"); if (z && !z.contains(e.target) && !$("#new").value && !$("#sheet").classList.contains("on")) z.classList.remove("focus"); });
  $$("#nPri button").forEach(b => b.onclick = () => { newPri = b.dataset.p; renderNewPri(); });
  $("#fab").onclick = () => openQuickAdd();
  $("#q").oninput = debounce(onSearch, 250);
  $("#mic").onclick = toggleMic;
  $("#sumBtn").onclick = openSummary;
  $("#acctBtn").onclick = () => legacy() ? showLogin() : openAccount();
  $("#nProj").onchange = () => { if ($("#nProj").value === "__new") { $("#nProj").value = ""; openProjects(true); } renderNewProj(); };
  $$("#nWho button").forEach(b => b.onclick = () => { newWho = b.dataset.w; renderNewWho(); });
}
function renderNewWho(){ $$("#nWho button").forEach(b => b.classList.toggle("on", b.dataset.w === newWho)); }
function renderNewPri(){ $$("#nPri button").forEach(b => b.classList.toggle("on", b.dataset.p === newPri)); }
function renderNewProj(){
  const sel = $("#nProj"); if (!sel) return;
  const cur = sel.value || (fProject && fProject !== "aucun" ? fProject : "");
  sel.innerHTML = `<option value="">Sans projet</option>` + projects.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join("") + `<option value="__new">+ Nouveau projet…</option>`;
  sel.value = projById(cur) ? cur : "";
  const p = projById(sel.value); $("#nProjDot").style.background = p ? p.color : "var(--line)";
}
function renderBanner(){
  const b = $("#banner");
  if (!legacy()) { b.innerHTML = ""; return; }
  b.innerHTML = `<div class="banner"><span><b>Mode ouvert.</b> Connecte-toi avec ta clé pour activer la section Mail et protéger tes tâches.</span><button id="bLogin">Se connecter</button></div>`;
  $("#bLogin").onclick = () => showLogin();
}

// Recherche dans la To Do : filtre la liste affichée (titre, notes, étiquettes, projet), sections dépliées
// Section suivante dans l'ordre des onglets (la dernière revient à la première) : cible du glissement vers la gauche
function nextSection(t){
  if (sections.length < 2) return null;
  const i = sections.findIndex(x => x.id === (t.section_id || sections[0].id));
  return sections[(i + 1) % sections.length];
}
function swipeToSection(t){
  const sc = nextSection(t);
  if (!sc) return openPostpone(t);
  const prev = t.section_id || sections[0].id;
  t.section_id = sc.id; renderList();
  api(`/tasks/${t.id}`, { method:"PATCH", body: JSON.stringify({ section_id: sc.id }) }).then(() => load()).catch(er => { toast(er.message); load(); });
  toast(`Déplacée dans « ${sc.name} »`, () => { api(`/tasks/${t.id}`, { method:"PATCH", body: JSON.stringify({ section_id: prev }) }).then(() => load()).catch(er => toast(er.message)); }, "Annuler");
}
const shortSec = n => { const r = String(n).replace(/^à faire\s+/i, ""); return r === n ? n : r.charAt(0).toUpperCase() + r.slice(1); };
let tFilter = "", curSec = (() => { try { return store.get("todo_sec") || ""; } catch { return ""; } })();
let collapsed = new Set((() => { try { return JSON.parse(store.get("todo_collapsed") || "[]"); } catch { return []; } })());
const norm = x => String(x || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
function applyTaskFilter(){
  const ul = $("#list"); if (!ul) return;
  const words = norm(tFilter).split(/\s+/).filter(Boolean);
  let shown = 0;
  ul.querySelectorAll("li[data-id]").forEach(li => {
    const t = tasks.find(x => x.id === li.dataset.id); if (!t) return;
    const hay = norm([t.title, t.notes, (t.tags || []).join(" "), projById(t.project_id)?.name].join(" "));
    const ok = words.every(w => hay.includes(w)); li.hidden = !ok; if (ok) shown++;
  });
  ul.querySelectorAll(".secempty").forEach(x => x.hidden = !!words.length);
  let head = null, hits = 0;
  const close = () => { if (head) head.hidden = !!words.length && !hits; };
  for (const el of ul.children) { if (el.classList.contains("sechead")) { close(); head = el; hits = 0; } else if (el.dataset.id && !el.hidden) hits++; }
  close();
  const sa = ul.querySelector(".secadd"); if (sa) sa.hidden = !!words.length;
  ul.querySelector(".nores")?.remove();
  if (words.length && !shown) ul.insertAdjacentHTML("afterbegin", `<div class="empty nores"><b>Aucune tâche trouvée</b>Essaie un autre mot.</div>`);
}

async function decide(p, accept, el){
  el.classList.add("busy");

    await api(`/proposals/${p.id}/${accept ? "accept" : "reject"}`, { method:"POST", body:"{}" });

}
function statsInfo(m){
  if (!m) return "";
  const c = m.capture || {}, a = m.suggestions_mail || {};
  const sec = c.median_ms ? (c.median_ms / 1000).toFixed(1).replace(".", ",") + " s" : "pas encore mesuré";
  const tot = (a.ajoutees || 0) + (a.ignorees || 0);
  const ratio = tot ? `${Math.round((a.ajoutees || 0) * 100 / tot)} % gardées (${a.ajoutees} ajoutées, ${a.ignorees} ignorées)` : "pas encore de choix";
  return `<div class="autoinfo"><b>Mesures sur 30 jours</b><br>Capture d'une tâche : ${sec}${c.n ? ` (médiane sur ${c.n})` : ""}.<br>Suggestions mail : ${ratio}${a.en_attente ? `, ${a.en_attente} en attente` : ""}.</div>`;
}
function autoInfo(o){
  if (!o) return "";
  const mode = o.mode === "live" ? "active" : o.mode === "off" ? "désactivée" : "en simulation (tu valides chaque proposition)";
  const r = o.last_run, st = o.stats || {};
  let last = "Aucune vérification pour l'instant.";
  if (r){
    const when = fmtAgo(r.ran_at);
    last = r.status === "ok" ? `Dernière vérification ${when} : ${r.mails} mail${r.mails>1?"s":""} envoyé${r.mails>1?"s":""} et ${r.events} rendez-vous examinés.`
      : r.status === "rien_a_verifier" ? `Dernière vérification ${when} : aucune tâche ouverte à vérifier.`
      : `<span class="warn">Dernière vérification ${when} : ${esc(r.note || "source inaccessible")}</span>`;
  }
  const decided = (st.acceptees || 0) + (st.refusees || 0);
  const bilan = decided ? `<br>Bilan : ${st.acceptees} validée${st.acceptees>1?"s":""}, ${st.refusees} refusée${st.refusees>1?"s":""}${st.rouvertes ? `, ${st.rouvertes} rouverte${st.rouvertes>1?"s":""}` : ""}.` : "";
  return `<div class="autoinfo"><b>Clôture automatique</b> ${mode}.<br>${last}${bilan}</div>`;
}

const VOICE_ENDPOINT = "https://qdepdtwrokazceyecege.supabase.co/functions/v1/transcribe-audio";
const VOICE_SECRET = "xh6y8dlA9-6x1ziYD9kmIP7kmFut6r4F";
let rec = null, recChunks = [], recStream = null, recTimer = null, recSec = 0;
let micBtn = null, recSink = null;
const setHint = t => { if (recSink) { const h = $(recSink.hint); if (h) h.textContent = t; return; } if ($("#hint")) $("#hint").textContent = t; if ($("#qhint")) $("#qhint").textContent = t; };
async function toggleMic(b){
  const btn = micBtn = (b instanceof HTMLElement ? b : null) || (rec && rec.state === "recording" ? micBtn : null) || $("#mic");
  if (rec && rec.state === "recording") { rec.stop(); return; }
  if (btn.classList.contains("busy")) return;
  try { recStream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch(e){ toast("Micro inaccessible : autorise-le dans les réglages du navigateur"); return; }
  const mime = ["audio/webm","audio/mp4","audio/ogg"].find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || "";
  rec = new MediaRecorder(recStream, mime ? { mimeType: mime } : undefined); recChunks = [];
  rec.ondataavailable = e => { if (e.data.size) recChunks.push(e.data); };
  rec.onstop = onRecStop;
  rec.start(); btn.classList.add("rec"); recSec = 0;
  setHint("Enregistrement 0:00 · touche à nouveau le micro pour terminer");
  recTimer = setInterval(() => { recSec++; setHint(`Enregistrement ${Math.floor(recSec/60)}:${String(recSec%60).padStart(2,"0")} · touche à nouveau le micro pour terminer`); if (recSec >= 180) rec.stop(); }, 1000);
}
async function onRecStop(){
  clearInterval(recTimer); recStream?.getTracks().forEach(t => t.stop());
  const btn = micBtn || $("#mic"); btn.classList.remove("rec"); btn.classList.add("busy");
  setHint("Transcription en cours…");
  try {
    const blob = new Blob(recChunks, { type: rec.mimeType || "audio/webm" });
    const ext = (rec.mimeType || "").includes("mp4") ? "m4a" : (rec.mimeType || "").includes("ogg") ? "ogg" : "webm";
    const form = new FormData(); form.append("audio", blob, "note." + ext);
    const r = await fetch(VOICE_ENDPOINT, { method: "POST", headers: { "x-app-key": VOICE_SECRET }, body: form });
    const j = await r.json();
    if (!r.ok || !j.transcript) throw new Error("Transcription impossible");
    if (recSink) recSink.done(j.transcript); else await runDictate(j.transcript);
  } catch(e){ toast(e.message); }
  finally { btn.classList.remove("busy"); if (recSink) { const h = $(recSink.hint); if (h) h.textContent = "Écris ou dicte, puis « Rédiger »."; recSink = null; } else if ($("#hint")) $("#hint").textContent = HINT; micBtn = null; }
}

// Rend lisible le HTML d'un mail reçu : on retire tout ce qui casse la mise en page ou piste, on garde la structure
function mailHtml(html){
  let doc;
  try { doc = new DOMParser().parseFromString(html, "text/html"); } catch(_) { return ""; }
  doc.querySelectorAll("script,style,link,meta,title,head,noscript,iframe,object,embed,form,input,button").forEach(n => n.remove());
  doc.querySelectorAll("*").forEach(n => {
    [...n.attributes].forEach(a => {
      const k = a.name.toLowerCase();
      if (k.startsWith("on") || (["href","src"].includes(k) && /^\s*javascript:/i.test(a.value))) n.removeAttribute(a.name);
      else if (["width","height","align","bgcolor","background","class","id"].includes(k)) n.removeAttribute(a.name);
      else if (k === "style") { const keep = (a.value.match(/(font-weight|font-style|text-align|text-decoration|list-style)\s*:[^;]+/gi) || []).join(";"); keep ? n.setAttribute("style", keep) : n.removeAttribute("style"); }
    });
    if (n.tagName === "A"){ n.setAttribute("target", "_blank"); n.setAttribute("rel", "noopener noreferrer"); }
    if (n.tagName === "IMG"){ const s = n.getAttribute("src") || ""; if (!/^https?:|^cid:/i.test(s) || /track|pixel|open|beacon|\b1x1\b/i.test(s)) n.remove(); else if (/^cid:/i.test(s)) n.remove(); }
  });
  // Tableaux de mise en page (Odoo, newsletters) : on les aplatit en blocs pour éviter les colonnes étroites
  doc.querySelectorAll("table,tbody,thead,tr,td,th,center").forEach(n => { const d = doc.createElement("div"); while (n.firstChild) d.appendChild(n.firstChild); n.replaceWith(d); });
  return (doc.body?.innerHTML || "").replace(/(\s*<div>\s*<\/div>\s*){2,}/g, "<div></div>").trim();
}
// Nettoie le texte brut d'un mail (ex. notifications Odoo) : marqueurs de liens [12], listes de références, lignes vides en trop
function cleanMailText(t){
  let s = String(t || "").replace(/\r/g, "");
  s = s.replace(/\n[ \t]*\[\d+\][ \t]+https?:\/\/\S+/g, "");   // liste de références en bas
  s = s.replace(/^[ \t]*\[\d+\][ \t]*$/gm, "");               // marqueur de référence seul sur sa ligne
  s = s.replace(/[ \t]*\[\d+\]/g, "");                        // marqueur de référence en fin de libellé
  s = s.replace(/^[ \t]*[-_=•*]{3,}[ \t]*$/gm, "");           // lignes de séparation décoratives
  s = s.replace(/[ \t]+$/gm, "").replace(/\n{3,}/g, "\n\n");  // espaces de fin et lignes vides multiples
  return s.trim();
}

// Suggestions d'adresses (équipe + correspondants récents) pendant la saisie, comme dans une messagerie
function contactsPool(){
  const seen = new Map();
  (team || []).forEach(p => seen.set(p.email.toLowerCase(), { name: p.name, email: p.email.toLowerCase(), team: true }));
  (mailData?.items || []).forEach(m => { const e = String(m.from_email || "").toLowerCase(); if (e && !seen.has(e)) seen.set(e, { name: m.from_name || "", email: e }); });
  return [...seen.values()];
}
function addrSuggest(input){
  if (!input) return;
  const box = document.createElement("div"); box.className = "sugg"; box.hidden = true; input.parentElement.appendChild(box);
  let items = [], idx = -1;
  const parts = () => { const v = input.value; const i = Math.max(v.lastIndexOf(","), v.lastIndexOf(";")); return { head: i >= 0 ? v.slice(0, i + 1) + " " : "", q: v.slice(i + 1).trim() }; };
  const close = () => { box.hidden = true; box.innerHTML = ""; items = []; idx = -1; };
  const pick = p => { const { head } = parts(); input.value = head + p.email + ", "; close(); input.focus(); input.dispatchEvent(new Event("input", { bubbles: true })); };
  const render = () => {
    box.innerHTML = items.map((p, i) => `<button type="button" class="${i === idx ? "on" : ""}" data-i="${i}"><span class="av">${esc((p.name || p.email)[0].toUpperCase())}</span><span class="nm">${esc(p.name || p.email)}</span><span class="em">${p.name ? esc(p.email) : ""}</span>${p.team ? `<span class="tm">équipe</span>` : ""}</button>`).join("");
    box.hidden = !items.length;
    box.querySelectorAll("button").forEach(b => { b.onmousedown = e => e.preventDefault(); b.onclick = () => pick(items[+b.dataset.i]); });
  };
  const update = () => {
    const { q } = parts(); const k = norm(q);
    if (k.length < 1) return close();
    const used = input.value.toLowerCase();
    items = contactsPool().filter(p => !used.includes(p.email) && (norm(p.name).includes(k) || p.email.includes(k)))
      .sort((a, b) => (b.team ? 1 : 0) - (a.team ? 1 : 0) || (norm(a.name).startsWith(k) ? -1 : 0) - (norm(b.name).startsWith(k) ? -1 : 0)).slice(0, 6);
    idx = items.length ? 0 : -1; render();
  };
  input.addEventListener("input", update);
  input.addEventListener("focus", () => { if (!team) loadTeam().then(update).catch(() => {}); });
  input.addEventListener("blur", () => setTimeout(close, 120));
  input.addEventListener("keydown", e => {
    if (box.hidden) return;
    if (e.key === "ArrowDown") { e.preventDefault(); idx = (idx + 1) % items.length; render(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); idx = (idx - 1 + items.length) % items.length; render(); }
    else if (e.key === "Enter" || e.key === "Tab") { if (idx >= 0) { e.preventDefault(); pick(items[idx]); } }
    else if (e.key === "Escape") close();
  });
  if (!team) loadTeam().catch(() => {});
}

// ---------- Notes : gras, italique, listes (enregistrées en texte simple : **gras**, *italique*, - liste) ----------
function mdInline(x){ return esc(x).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/(^|[^*])\*([^*\n]+?)\*(?!\*)/g, "$1<i>$2</i>").replace(/(https:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>'); }
function mdToHtml(md){
  const lines = String(md).split("\n"); let out = "", inList = false;
  for (const l of lines) {
    const m = l.match(/^\s*[-•]\s+(.*)$/);
    if (m) { if (!inList) { out += "<ul>"; inList = true; } out += `<li>${mdInline(m[1])}</li>`; continue; }
    if (inList) { out += "</ul>"; inList = false; }
    out += `<div>${l.trim() ? mdInline(l) : "<br>"}</div>`;
  }
  if (inList) out += "</ul>";
  return md.trim() ? out : "";
}
function htmlToMd(root){
  const inl = n => {
    if (n.nodeType === 3) return n.nodeValue.replace(/ /g, " ");
    if (n.nodeType !== 1) return "";
    const tag = n.tagName, kids = [...n.childNodes].map(inl).join("");
    const w = n.style || {};
    if (tag === "BR") return "\n";
    if ((tag === "B" || tag === "STRONG" || w.fontWeight === "bold" || +w.fontWeight >= 600) && kids.trim()) return `**${kids.trim()}**`;
    if ((tag === "I" || tag === "EM" || w.fontStyle === "italic") && kids.trim()) return `*${kids.trim()}*`;
    if (tag === "UL" || tag === "OL") return "\n" + [...n.children].map(li => "- " + inl(li).replace(/\n+/g, " ").trim()).join("\n") + "\n";
    if (tag === "DIV" || tag === "P" || tag === "LI") return "\n" + kids + "\n";
    if (tag === "A") return kids;
    return kids;
  };
  return [...root.childNodes].map(inl).join("").replace(/\n{3,}/g, "\n\n").replace(/^\n+|\n+$/g, "");
}

let uploading = [];
async function shrinkImage(file){
  if (!/^image\/(jpeg|png|webp)$/.test(file.type) || file.size < 900000) return file;
  try {
    const bmp = await createImageBitmap(file); const k = Math.min(1, 2000 / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, "image/jpeg", 0.85));
    return blob && blob.size < file.size ? new File([blob], file.name.replace(/\.\w+$/, "") + ".jpg", { type: "image/jpeg" }) : file;
  } catch { return file; }
}
async function uploadFile(t, file){

    if (f.size > 15 * 1024 * 1024) throw new Error(`${file.name} : 15 Mo au maximum`);
    const r = await fetch(`${API}/tasks/${t.id}/files`, { method:"POST", headers: { Authorization: "Bearer " + token, "Content-Type": f.type || "application/octet-stream", "x-file-name": encodeURIComponent(f.name) }, body: f });

    t.files_count = (t.files_count || 0) + 1;
    toast(`Ajouté : ${f.name}`);

// Ordre affiché, avec la section de chaque tâche, envoyé tel quel au serveur
function domOrder(ul){
  const items = []; let sec = view === "today" && sections.length ? (curSec || null) : null;
  for (const el of ul.children) {
    if (el.classList.contains("sechead")) sec = el.dataset.sid;
    else if (el.dataset.id) items.push({ id: el.dataset.id, section_id: sec });
  }
  return items;
}
async function saveOrder(items){
  try { await api("/tasks/reorder", { method:"POST", body: JSON.stringify({ items }) }); }
  catch(e){ toast(e.message); load(); }
}
function applyOrder(items){
  const byId = new Map(tasks.map(t => [t.id, t]));
  tasks = items.map(x => { const t = byId.get(x.id); t.section_id = x.section_id; return t; }).concat(tasks.filter(t => !items.some(x => x.id === t.id)));
}
function moveTask(t, dir){
  const ul = $("#list"); if (!ul) return;
  const items = domOrder(ul);
  const i = items.findIndex(x => x.id === t.id);
  const mates = items.map((x, k) => [x, k]).filter(([x]) => x.section_id === items[i].section_id);
  const pos = mates.findIndex(([x]) => x.id === t.id), other = mates[pos + dir];
  if (!other) { toast(dir < 0 ? "Déjà en haut de sa section" : "Déjà en bas de sa section"); return; }
  const j = other[1]; [items[i], items[j]] = [items[j], items[i]];
  closeSheet(); applyOrder(items); renderList(); saveOrder(items); toast(dir < 0 ? "Montée" : "Descendue");
}
// Appui long (0,45 s) puis glisser n'importe où dans la liste, y compris d'une section à l'autre
function longDrag(li){
  const row = li.querySelector(".row"); let timer = null, drag = false, y0 = 0, x0 = 0, base = 0, pid = null, px = 0, py = 0, grabOff = 0, raf = 0;
  const cancel = () => { clearTimeout(timer); timer = null; };
  const movable = el => el && el.tagName === "LI" && !el.classList.contains("secadd");
  const docMove = e => { if (drag && e.pointerId === pid) { px = e.clientX; py = e.clientY; place(); } };
  const docUp = e => { if (e.pointerId === pid) end(e.type === "pointercancel" ? null : e); };
  const startDrag = () => { timer = null; drag = true; li._drag = true; base = 0; px = x0; py = y0; li.classList.add("lift"); navigator.vibrate?.(12); try { row.setPointerCapture(pid); } catch {}
    document.addEventListener("pointermove", docMove); document.addEventListener("pointerup", docUp); document.addEventListener("pointercancel", docUp); begin(); };
  const grip = li.querySelector(".grip");
  if (grip) grip.addEventListener("pointerdown", e => {
    if (e.pointerType === "mouse" && e.button !== 0) return;
    if (tFilter) return toast("Efface la recherche pour réordonner");
    e.preventDefault(); x0 = e.clientX; y0 = e.clientY; pid = e.pointerId; startDrag();
  });
  row.addEventListener("pointerdown", e => {
    if (e.target.closest(".check") || e.target.closest(".grip") || tFilter || (e.pointerType === "mouse" && e.button !== 0)) return;
    x0 = e.clientX; y0 = e.clientY; pid = e.pointerId;
    timer = setTimeout(startDrag, 450);
  });
  // Suit le doigt ou la souris : l'élément reste sous le pointeur, la liste défile seule près des bords
  const place = () => {
    li.style.transform = ""; const nat = li.getBoundingClientRect().top;
    let prev = li.previousElementSibling, next = li.nextElementSibling;
    // On déplace toujours le voisin, jamais l'élément tenu : sinon le navigateur perd le suivi du pointeur
    if (movable(prev) && py - grabOff < prev.getBoundingClientRect().top + prev.offsetHeight / 2) li.parentElement.insertBefore(prev, li.nextSibling);
    else if (movable(next) && py - grabOff + li.offsetHeight > next.getBoundingClientRect().top + next.offsetHeight / 2) li.parentElement.insertBefore(next, li);
    const now = li.getBoundingClientRect().top;
    li.style.transform = `translateY(${py - grabOff - now}px)`;
    const over = document.elementsFromPoint(px, py).find(x => x.classList?.contains("stab"));
    document.querySelectorAll(".stab").forEach(x => x.classList.toggle("drop", x === over && x.dataset.sid !== curSec));
  };
  const tick = () => {
    if (!drag) { raf = 0; return; }
    const h = window.innerHeight, tb = Math.max(0, document.querySelector(".stabs")?.getBoundingClientRect().bottom ?? 0), top = tb + 70, bot = h - 80;
    // Au-dessus des onglets : pas de défilement, pour pouvoir y déposer la tâche
    const v = py > tb && py < top ? -Math.ceil((top - py) / 5) : py > bot ? Math.ceil((py - bot) / 5) : 0;
    if (v) { window.scrollBy(0, v); place(); }
    raf = requestAnimationFrame(tick);
  };
  const begin = () => { grabOff = py - li.getBoundingClientRect().top; if (!raf) raf = requestAnimationFrame(tick); };
  row.addEventListener("pointermove", e => {
    if (timer && (Math.abs(e.clientX - x0) > 8 || Math.abs(e.clientY - y0) > 8)) cancel();
    if (!drag) return;
    e.preventDefault(); px = e.clientX; py = e.clientY; place();
  });
  li.addEventListener("touchmove", e => { if (drag) e.preventDefault(); }, { passive: false });
  const end = e => {
    cancel(); document.removeEventListener("pointermove", docMove); document.removeEventListener("pointerup", docUp); document.removeEventListener("pointercancel", docUp);
    if (!drag) return;
    const tab = e && document.elementsFromPoint(e.clientX, e.clientY).find(x => x.classList?.contains("stab"));
    document.querySelectorAll(".stab.drop").forEach(x => x.classList.remove("drop"));
    if (tab && tab.dataset.sid !== curSec) {
      drag = false; li._drag = false; li.classList.remove("lift"); li.style.transform = "";
      const t = tasks.find(x => x.id === li.dataset.id), sc = sections.find(x => x.id === tab.dataset.sid);
      t.section_id = sc.id; renderList();
      api(`/tasks/${t.id}`, { method:"PATCH", body: JSON.stringify({ section_id: sc.id }) }).then(() => load()).catch(er => { toast(er.message); load(); });
      toast(`Déplacée dans « ${sc.name} »`);
      return;
    }
    drag = false; li._drag = false; li.dataset.dragged = "1"; setTimeout(() => delete li.dataset.dragged, 400);
    li.classList.remove("lift"); li.style.transform = "";
    const ul = li.parentElement, items = domOrder(ul);
    const before = tasks.map(t => t.id + ":" + (t.section_id || "")).join();
    if (before !== items.map(x => x.id + ":" + (x.section_id || "")).join()) {
      applyOrder(items); saveOrder(items); renderList(); toast("Ordre enregistré");
    }
  };
  row.addEventListener("pointerup", end); row.addEventListener("pointercancel", () => end(null));
  row.addEventListener("contextmenu", e => { if (drag || timer) e.preventDefault(); });
}
// Créer, renommer, déplacer ou supprimer une section
function openSection(sc){
  const i = sc ? sections.findIndex(x => x.id === sc.id) : -1;
  $("#panel").innerHTML = `<h3>${sc ? "Section" : "Nouvelle section"}</h3>
    <label>Nom</label><input id="sname" value="${esc(sc?.name || "")}" placeholder="Ex. Chantiers, Admin, Cette semaine" maxlength="60" autocomplete="off">
    ${sc ? `<div class="chips" style="margin-top:12px"><button id="sup" ${i <= 0 ? "disabled" : ""}>↑ Monter la section</button><button id="sdown" ${i >= sections.length - 1 ? "disabled" : ""}>↓ Descendre la section</button></div>
      <p>Supprimer la section garde ses tâches : elles remontent en haut de la liste, sans section.</p>` : ""}
    ${sc ? `<div class="tools" style="margin-top:10px"><button type="button" id="snew">+ Nouvelle section</button></div>` : ""}
    <div class="actions">${sc && sc.name !== "To Do" ? `<button class="danger" id="sdel">Supprimer</button>` : sc ? `<span class="hint" style="align-self:center">La section To Do reçoit les nouvelles tâches.</span>` : `<button id="cancel">Annuler</button>`}<button class="primary" id="ssave">${sc ? "Enregistrer" : "Créer"}</button></div>`;
  const save = async () => {
    const name = $("#sname").value.replace(/\s+/g, " ").trim(); if (!name) { $("#sname").focus(); return; }
    try {
      if (sc) { if (name !== sc.name) await api(`/sections/${sc.id}`, { method:"PATCH", body: JSON.stringify({ name }) }); toast("Section enregistrée"); }
      else { await api("/sections", { method:"POST", body: JSON.stringify({ name }) }); toast(`Section créée : ${name}`); }
      closeSheet(); load();
    } catch(e){ toast(e.message); }
  };
  $("#ssave").onclick = save;
  if ($("#snew")) $("#snew").onclick = () => openSection(null);
  $("#sname").onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); save(); } };
  if ($("#cancel")) $("#cancel").onclick = closeSheet;
  const shift = async d => {
    const ids = sections.map(x => x.id); const j = i + d; [ids[i], ids[j]] = [ids[j], ids[i]];
    try { await api("/sections/reorder", { method:"POST", body: JSON.stringify({ ids }) }); closeSheet(); load(); } catch(e){ toast(e.message); }
  };
  if ($("#sup")) { $("#sup").onclick = () => shift(-1); $("#sdown").onclick = () => shift(1); }
  if ($("#sdel")) $("#sdel").onclick = async () => {
    const b = $("#sdel");
    if (b.dataset.arm !== "1") { b.dataset.arm = "1"; b.textContent = "Confirmer la suppression"; return; }
    try { await api(`/sections/${sc.id}`, { method:"DELETE" }); toast("Section supprimée, tâches gardées"); closeSheet(); load(); } catch(e){ toast(e.message); }
  };
  openSheet(); setTimeout(() => $("#sname")?.focus(), 60);
}

// ---------- Projets ----------
let delArm = null;
function openProjects(focusNew){
  delArm = null;
  $("#panel").innerHTML = `<h3>Projets</h3>
    <div id="plist">${projects.length ? projects.map(p => `<div class="prow" data-id="${p.id}">
      <button class="sw" style="background:${p.color}" aria-label="Changer la couleur"></button>
      <input value="${esc(p.name)}" aria-label="Nom du projet" maxlength="60"><span class="pc">${p.open_count || 0}</span>
      <button class="x">Supprimer</button></div>`).join("") : `<div class="empty" style="padding:16px">Aucun projet pour l'instant.</div>`}</div>
    <form class="newp" id="newp"><input id="np" placeholder="Nouveau projet" maxlength="60" autocomplete="off"><button>Créer</button></form>
    <div class="hint">Supprimer un projet garde ses tâches, sans projet.</div>
    <div class="actions"><button class="primary" id="cancel">Fermer</button></div>`;
  $("#cancel").onclick = () => { closeSheet(); load(); };
  $("#newp").onsubmit = async e => {
    e.preventDefault(); const name = $("#np").value.trim(); if (!name) return;
    try { const p = await api("/projects", { method:"POST", body: JSON.stringify({ name }) }); projects.push(p); toast(`Projet créé : ${p.name}`); renderNewProj(); $("#nProj").value = p.id; renderNewProj(); openProjects(false); }
    catch(err){ toast(err.message); }
  };
  $("#plist").querySelectorAll(".prow").forEach(row => {
    const p = projById(row.dataset.id);
    row.querySelector(".sw").onclick = async () => {
      const color = PALETTE[(PALETTE.indexOf(p.color) + 1) % PALETTE.length];
      try { await api(`/projects/${p.id}`, { method:"PATCH", body: JSON.stringify({ color }) }); p.color = color; row.querySelector(".sw").style.background = color; } catch(err){ toast(err.message); }
    };
    const inp = row.querySelector("input");
    inp.onchange = async () => {
      const name = inp.value.trim(); if (!name || name === p.name) { inp.value = p.name; return; }
      try { await api(`/projects/${p.id}`, { method:"PATCH", body: JSON.stringify({ name }) }); p.name = name; toast("Projet renommé"); } catch(err){ toast(err.message); inp.value = p.name; }
    };
    const x = row.querySelector(".x");
    x.onclick = async () => {
      if (delArm !== p.id) { delArm = p.id; x.textContent = "Confirmer"; return; }
      try { await api(`/projects/${p.id}`, { method:"DELETE" }); projects = projects.filter(q => q.id !== p.id); if (fProject === p.id) { fProject = ""; store.set("todo_fproject", ""); } toast(`Projet supprimé : ${p.name}`); openProjects(false); }
      catch(err){ toast(err.message); }
    };
  });
  openSheet();
  if (focusNew) setTimeout(() => $("#np")?.focus(), 50);
}

  if ($("#legacyBtn")) $("#legacyBtn").onclick = async () => {

      $("#ie").value = ""; $("#in").value = "";
      const msg = `Voici ton accès à la To Do :\n1. Ouvre ${APP}\n2. Colle cette clé et clique « Se connecter avec ma clé » :\n${r.key}\nGarde-la pour toi, elle donne accès à ta liste.`;
      $("#inew").innerHTML = `<p style="color:var(--ink);margin-top:12px"><b>Compte créé pour ${esc(r.user.email)}.</b> Envoie-lui ce message, la clé ne sera plus affichée.</p>
        <div class="secret" style="white-space:pre-wrap">${esc(msg)}</div><button class="cbtn" data-c="${esc(msg)}">Copier le message</button>`;
      $$("#inew .cbtn").forEach(b => b.onclick = async () => { try { await navigator.clipboard.writeText(b.dataset.c); toast("Copié"); } catch { toast("Copie impossible, sélectionne le texte"); } });
    } catch(e){ toast(e.message); }
  };
  $("#newk").onsubmit = async e => {
    e.preventDefault();

      $("#kl").value = "";
      $("#knew").innerHTML = `<p style="color:var(--ink);margin-top:12px"><b>Copie-la maintenant, elle ne sera plus affichée.</b></p>

        <p>Siri (raccourci, action « Obtenir le contenu de l'URL ») :</p><div class="secret">${esc(API)}/voice?key=${esc(k.key)}</div><button class="cbtn" data-c="${esc(API)}/voice?key=${esc(k.key)}">Copier</button>

async function loadKeys(){
  try {
    const ks = await api("/keys");
    $("#klist").innerHTML = ks.length ? ks.map(k => `<div class="krow"><div class="kl">${esc(k.label)}<div class="kd">créée ${fmtAgo(k.created_at)}${k.last_used_at ? ` · utilisée ${fmtAgo(k.last_used_at)}` : ""}</div></div><button data-k="${k.id}">Révoquer</button></div>`).join("") : `<p>Aucune clé.</p>`;
    $$("#klist button").forEach(b => b.onclick = async () => {
      if (b.textContent !== "Confirmer") { b.textContent = "Confirmer"; return; }
      try { await api(`/keys/${b.dataset.k}`, { method:"DELETE" }); toast("Clé révoquée"); loadKeys(); } catch(e){ toast(e.message); }
    });
  } catch(e){ $("#klist").innerHTML = `<p>${esc(e.message)}</p>`; }
}

function openSheet(){ $("#toast").classList.remove("on"); $("#sheet").classList.add("on"); polishSheet(); }
let polishQueued = false;
new MutationObserver(() => { if (polishQueued) return; polishQueued = true; queueMicrotask(() => { polishQueued = false; polishSheet(); }); }).observe($("#panel"), { childList: true });
function polishSheet(){
  const panel = $("#panel"), h = panel.firstElementChild;
  // Toutes les fiches partagent le même en-tête (titre + fermer) et le même pied (secondaire à gauche, principal à droite)
  if (h && h.tagName === "H3") {
    const head = document.createElement("div"); head.className = "sheethead";
    panel.insertBefore(head, h); head.appendChild(h);
    const x = document.createElement("button"); x.className = "xbtn"; x.setAttribute("aria-label", "Fermer"); x.innerHTML = ic("x", 16);
    x.onclick = () => { const re = $("#plist") || $("#fw"); closeSheet(); if (re) load(); };
    head.appendChild(x);
  }
  const acts = [...panel.querySelectorAll(":scope > .actions")].pop();
  if (acts && !acts.classList.contains("foot")) {
    acts.classList.add("foot");
    let prim = acts.querySelector(".primary"); const btns = [...acts.children];
    if (prim && btns.length === 1 && /^fermer$/i.test(prim.textContent.trim())) { prim.classList.remove("primary"); prim = null; }
    btns.forEach(b => { if (b !== prim && b.tagName === "BUTTON" && /^(fermer|annuler|retour)$/i.test(b.textContent.trim()) && !b.classList.contains("danger") && btns.length > 1) b.classList.add("ghost"); });
    if (!acts.querySelector(".sp")) { const sp = document.createElement("span"); sp.className = "sp"; const anchor = prim || acts.lastElementChild; acts.insertBefore(sp, anchor); }
  }
}
function closeSheet(){ $("#sheet").classList.remove("on"); $("#panel").classList.remove("read"); }
$("#sheet").onclick = e => { if (e.target.id === "sheet") { const re = $("#plist") || $("#fw"); closeSheet(); if (re) load(); } };

// ---------- Glisser ----------
function swipe(li, t){
  const row = li.querySelector(".row"); let x0=0, y0=0, dx=0, active=false, locked=false;
  row.addEventListener("pointerdown", e => { if (e.pointerType === "mouse") return; x0=e.clientX; y0=e.clientY; dx=0; active=true; locked=false; row.style.transition="none"; });
  row.addEventListener("pointermove", e => {
    if (li._drag) { active = false; row.style.transform = ""; return; }
    if (!active) return; const ddx = e.clientX-x0, ddy = e.clientY-y0;
    if (!locked){ if (Math.abs(ddy) > 10 && Math.abs(ddy) > Math.abs(ddx)) { active=false; row.style.transition=""; return; } if (Math.abs(ddx) > 10) { locked=true; row.setPointerCapture(e.pointerId); } }
    if (locked){ dx = ddx; row.style.transform = `translateX(${dx}px)`; li.querySelector(".bgR").style.opacity = dx>0?1:0; li.querySelector(".bgL").style.opacity = dx<0?1:0; }
  });
  const end = () => {
    if (!active) return; active=false; row.style.transition="";
    const w = row.offsetWidth * .3;
    if (dx > w){ row.style.transform = `translateX(100%)`; setTimeout(() => complete(t), 150); }
    else if (dx < -w){ row.style.transform = `translateX(-100%)`; setTimeout(() => swipeToSection(t), 150); }
    else row.style.transform = "";
  };
  row.addEventListener("pointerup", end); row.addEventListener("pointercancel", end);
}

// ---------- Divers ----------
let toastTimer;
function toast(msg, undo, label){
  $("#toastMsg").textContent = msg; const b = $("#toastUndo");
  b.textContent = label || "Annuler";
  b.style.display = undo ? "" : "none"; b.onclick = () => { $("#toast").classList.remove("on"); undo && undo(); };
  $("#toast").classList.add("on"); clearTimeout(toastTimer); toastTimer = setTimeout(() => $("#toast").classList.remove("on"), undo ? 7000 : 5000);
}
function debounce(f, ms){ let t; return (...a) => { clearTimeout(t); t = setTimeout(() => f(...a), ms); }; }
document.addEventListener("visibilitychange", () => { if (!document.hidden && !searching && meInfo && $("#content")) load(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); if (e.key === "n" && document.activeElement === document.body) { e.preventDefault(); $("#new")?.focus(); } });
matchMedia("(min-width:980px)").addEventListener?.("change", () => meInfo && $("#content") && load());

async function boot(){
  const msg = readHash();
  store.del("todo_key");
  try { meInfo = await api("/me"); }
  catch(e){ meInfo = null; return showLogin(msg.auth || ""); }
  if (msg.mail || msg.mailErr) { view = "mail"; store.set("todo_view", "mail"); }
  renderShell(); renderBanner(); renderNav(); load();
  if (msg.mail) toast(msg.mail);
  if (msg.mailErr) toast("Connexion de la boîte impossible : " + msg.mailErr);
  if (msg.auth) toast(msg.auth);
}
boot();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js", { scope: "./" }).catch(()=>{});
