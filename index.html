<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>To Do</title>
<meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151514" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="To Do">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --bg:#f6f5f1; --card:#ffffff; --side:#fbfaf7; --ink:#1b1b19; --muted:#7a786f; --line:#e6e3da; --hover:#f0eee8;
  --accent:#1f7a4d; --accent-soft:#e3f1e9; --late:#b4532a; --late-soft:#f8e9e1; --danger:#b42a2a;
  --agent:#5b3fd1; --agent-soft:#ece8fb; --warn:#9a6a00; --warn-soft:#fbf1d6;
  --radius:14px; --shadow:0 1px 2px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#151514; --card:#1f1f1d; --side:#191918; --ink:#efede6; --muted:#9a978d; --line:#2e2d2a; --hover:#262624;
  --accent:#4cc38a; --accent-soft:#1d3428; --late:#e4885d; --late-soft:#3a261c; --danger:#e46b6b;
  --agent:#ab9cff; --agent-soft:#2a2540; --warn:#e2b54f; --warn-soft:#3a3020; --shadow:none;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
body{min-height:100dvh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button{font:inherit}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}

/* ---------- Mise en page ---------- */
.app{min-height:100dvh}
.side,.aside{display:none}
.main{max-width:680px;margin:0 auto;padding:16px 16px 120px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0 14px}
header.top h1{font-size:28px;letter-spacing:-.02em;margin:0;font-weight:700}
.sub{color:var(--muted);font-size:14px}
.hright{display:flex;align-items:center;gap:8px}
.hbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:13.5px;cursor:pointer}
.avatar{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:700;font-size:13px;cursor:pointer;flex:none}
@media (min-width:980px){
  .app{display:grid;grid-template-columns:252px minmax(0,1fr);}
  .side{display:flex;flex-direction:column;position:sticky;top:0;height:100dvh;overflow:auto;background:var(--side);border-right:1px solid var(--line);padding:18px 12px 14px}
  .main{max-width:760px;width:100%;padding:28px 32px 80px}
  .mob{display:none !important}
  header.top h1{font-size:26px}
}
@media (min-width:1280px){
  .app{grid-template-columns:252px minmax(0,1fr) 340px}
  .aside{display:block;position:sticky;top:0;height:100dvh;overflow:auto;border-left:1px solid var(--line);padding:28px 20px}
  .main .asksWrap{display:none}
}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 16px}
.brand b{font-size:19px;letter-spacing:-.01em}
.brand .lg{width:28px;height:28px;border-radius:8px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800}
.snav{display:flex;flex-direction:column;gap:2px}
.snav button,.sproj button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;color:var(--ink);text-align:left;border-radius:9px;padding:8px 10px;font-size:14.5px;cursor:pointer}
.snav button:hover,.sproj button:hover{background:var(--hover)}
.snav button.on,.sproj button.on{background:var(--card);box-shadow:0 0 0 1px var(--line);font-weight:600}
.snav .ic{width:18px;text-align:center;color:var(--muted)}
.snav .n,.sproj .n{margin-left:auto;color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
.snav .n.hot{color:#fff;background:var(--late);border-radius:999px;padding:0 7px;font-weight:600}
.stitle{display:flex;align-items:center;justify-content:space-between;margin:20px 10px 6px;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stitle button{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:16px;line-height:1;padding:0 2px}
.sproj{display:flex;flex-direction:column;gap:1px}
.sproj .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.swho{display:flex;gap:4px;margin:0 6px}
.swho button{flex:1;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:8px;padding:6px 4px;font-size:13px;cursor:pointer}
.swho button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.swho button.on.ag{background:var(--agent);border-color:var(--agent);color:#fff}
.sfoot{margin-top:auto;padding-top:14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.acct{display:flex;align-items:center;gap:10px;border:0;background:transparent;color:var(--ink);border-radius:10px;padding:8px;cursor:pointer;text-align:left;width:100%}
.acct:hover{background:var(--hover)}
.acct .em{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- Bandeau, ajout ---------- */
.banner{display:flex;gap:10px;align-items:center;background:var(--warn-soft);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13.5px;margin-bottom:12px}
.banner b{color:var(--warn)}
.banner button{margin-left:auto;flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:6px 10px;font-size:13px;cursor:pointer}
.add{display:flex;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:6px 6px 6px 14px;box-shadow:var(--shadow)}
.add input{flex:1;border:0;background:transparent;color:var(--ink);font:inherit;font-size:17px;outline:none;min-width:0}
.add button{border:0;background:var(--accent);color:#fff;border-radius:10px;width:40px;height:40px;font-size:22px;cursor:pointer;flex:none}
.add .mic{background:var(--accent-soft);color:var(--accent)}
.add .mic svg{width:20px;height:20px;vertical-align:middle}
.add .mic.rec{background:#d64545;color:#fff;animation:pulse 1.4s infinite}
.add .mic.busy{opacity:.6}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(214,69,69,.45)}70%{box-shadow:0 0 0 12px rgba(214,69,69,0)}100%{box-shadow:0 0 0 0 rgba(214,69,69,0)}}
@media (max-width:979px){.add{position:sticky;top:max(8px,env(safe-area-inset-top));z-index:5}}
.opts{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:8px 0 0}
.opt{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:0 10px;min-height:34px;font-size:13.5px;max-width:100%}
.opt select,.opt input{border:0;background:transparent;color:inherit;font:inherit;font-size:13.5px;outline:none;padding:0;min-width:0;max-width:170px}
.opt input[type=date]{max-width:132px}
.opt .lbl{color:var(--muted)}
.seg{display:inline-flex;flex:none;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:transparent;color:var(--muted);font-size:13.5px;padding:0 12px;min-height:32px;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--ink);color:var(--bg)}
.seg button.on.ag{background:var(--agent);color:#fff}
.hint{color:var(--muted);font-size:12.5px;margin:6px 4px 0}

/* ---------- Navigation mobile ---------- */
nav.tabs{display:flex;gap:6px;margin:18px 0 10px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:7px 14px;font-size:14px;white-space:nowrap;cursor:pointer;flex:none}
nav.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
nav.tabs .n{opacity:.7;margin-left:4px;font-variant-numeric:tabular-nums}
nav.tabs .n.hot{opacity:1;color:#fff;background:var(--late);border-radius:999px;padding:0 6px}
.pfilter{display:flex;gap:6px;overflow-x:auto;margin:0 0 10px;padding-bottom:2px;scrollbar-width:none;align-items:center}
.pfilter::-webkit-scrollbar{display:none}
.pfilter .pf{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:10px;padding:0 10px;min-height:32px;font-size:13px;cursor:pointer;white-space:nowrap}
.pfilter .pf.on{border-color:var(--ink);color:var(--ink);background:var(--card);font-weight:600}
.pfilter .n{opacity:.7;font-variant-numeric:tabular-nums}
.pfilter .sep{flex:none;width:1px;height:20px;background:var(--line);margin:0 2px}
.vhead{display:none}
@media (min-width:980px){.vhead{display:flex;align-items:baseline;gap:10px;margin:26px 0 12px}.vhead h2{margin:0;font-size:18px}.vhead .sub{font-size:13.5px}}

/* ---------- Liste ---------- */
.search{display:none;margin:12px 0 10px}
.search.on{display:block}
.search input{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 12px;font:inherit}
ul{list-style:none;margin:0;padding:0}
li{position:relative;margin-bottom:8px;border-radius:var(--radius);overflow:hidden}
.bgL,.bgR{opacity:0;position:absolute;inset:0;display:flex;align-items:center;padding:0 18px;font-weight:600;font-size:14px;color:#fff}
.bgR{background:var(--accent)} .bgL{background:#5b6b8a;justify-content:flex-end}
.row{position:relative;display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:13px 14px;box-shadow:var(--shadow);touch-action:pan-y;transition:transform .18s ease}
@media (min-width:980px){.row{padding:12px 14px}.row:hover{border-color:var(--muted)}}
.check{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--muted);background:transparent;margin-top:1px;cursor:pointer;padding:0}
.check:hover{border-color:var(--accent);background:var(--accent-soft)}
.done .check{background:var(--accent);border-color:var(--accent)}
.body{flex:1;min-width:0;cursor:pointer}
.title{word-wrap:break-word}
.done .title{color:var(--muted);text-decoration:line-through}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;margin-top:4px;font-size:12.5px;color:var(--muted)}
.meta .late{color:var(--late);font-weight:600}
.meta .auto{color:var(--accent)}
.ptag{display:inline-flex;align-items:center;gap:5px}
.agtag{display:inline-flex;align-items:center;gap:4px;color:var(--agent);background:var(--agent-soft);border-radius:6px;padding:0 6px;font-weight:600}
.tlink{display:block;margin-top:6px;font-size:13px;color:var(--accent);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tlink:hover{text-decoration:underline}
.more{flex:none;border:0;background:transparent;color:var(--muted);font-size:18px;cursor:pointer;padding:0 2px}
.empty{color:var(--muted);text-align:center;padding:48px 16px}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
.foot{color:var(--muted);font-size:12px;text-align:center;margin-top:24px}

/* ---------- C'est fait ? ---------- */
.asksH{display:flex;align-items:center;gap:8px;margin:18px 4px 8px;font-size:13.5px;font-weight:600;color:var(--accent)}
.aside .asksH{margin-top:0}
.asksH .n{background:var(--accent);color:var(--card);border-radius:999px;padding:1px 8px;font-size:12px;font-variant-numeric:tabular-nums}
.asksH .sim{margin-left:auto;font-weight:400;color:var(--muted);font-size:12.5px}
.ask{background:var(--accent-soft);border:1px solid var(--accent);border-radius:var(--radius);padding:12px 14px;margin-bottom:8px}
.ask .at{font-weight:600;word-wrap:break-word}
.ask .ap{font-size:13.5px;margin-top:4px;word-wrap:break-word}
.ask .ap b{font-weight:600}
.ask .ab{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.ask .ac{flex:1;font-size:12.5px;color:var(--muted)}
.ask button{border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:10px;padding:7px 12px;font-size:14px;cursor:pointer}
.ask button.yes{background:var(--accent);color:var(--card);font-weight:600}
.ask.busy{opacity:.5;pointer-events:none}
.aside h3{font-size:13.5px;margin:22px 4px 8px;color:var(--muted);font-weight:600}
.mini{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 12px;margin-bottom:6px;cursor:pointer}
.mini .ms{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini .mf{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.calm{color:var(--muted);font-size:13.5px;padding:4px}

/* ---------- Section Mail ---------- */
.mailbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:4px 0 10px}
.mailbar .grow{flex:1}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 12px;font-size:14px;cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.accts{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.acc{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 12px;font-size:13.5px}
.acc .ai{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-weight:700;font-size:12px;color:#fff;flex:none}
.acc .at{flex:1;min-width:0}
.acc .at div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acc .as{color:var(--muted);font-size:12.5px}
.acc .as.err{color:var(--danger)}
.acc button{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:13px}
.msub{display:flex;gap:6px;margin:6px 0 12px;flex-wrap:wrap}
.msub button{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:6px 12px;font-size:13.5px;cursor:pointer}
.msub button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.mail{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:8px;box-shadow:var(--shadow)}
.mail .mh{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.mail .from{color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.mail .age{margin-left:auto;flex:none}
.prio{flex:none;border-radius:6px;padding:1px 7px;font-size:12px;font-weight:700}
.prio.h{background:var(--late-soft);color:var(--late)}
.prio.m{background:var(--warn-soft);color:var(--warn)}
.prio.l{background:var(--hover);color:var(--muted)}
.mail .msj{font-weight:600;margin-top:4px;word-wrap:break-word}
.mail .msn{font-size:13.5px;color:var(--muted);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mail .mwhy{font-size:12px;color:var(--muted);margin-top:6px}
.mail .ma{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.mail .ma a{color:var(--accent);text-decoration:none;font-size:14px;margin-right:auto}
.mail .ma .ok{color:var(--accent);font-size:13.5px;font-weight:600}
.mail .mopen{cursor:pointer}
.mail .mopen:hover .msj{text-decoration:underline}
.mail .mread{font-size:13px;color:var(--accent);margin-top:4px}
@media (min-width:980px){.panel.read{max-width:760px}}
.xclose{position:sticky;top:-18px;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:8px;margin:-18px -16px 10px;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line)}
.xclose .xt{font-size:13px;color:var(--muted)}
.xclose button{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;cursor:pointer;min-height:40px}
.xclose button:hover{background:var(--hover)}
.rd .rh{font-size:13px;color:var(--muted);line-height:1.5}
.rd .rh b{color:var(--ink);font-weight:600}
.rd h3{margin:4px 0 8px;word-wrap:break-word}
.rd .rbody{white-space:pre-wrap;word-wrap:break-word;font-size:14.5px;line-height:1.55;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:12px 0;max-height:52dvh;overflow:auto}
.rd .rfiles{font-size:13px;color:var(--muted)}
.rd .rnote{font-size:13px;color:var(--muted);margin-top:8px}
.rd .rlinks{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.rd .rlinks a{color:var(--accent);text-decoration:none;font-size:14px;border:1px solid var(--line);border-radius:10px;padding:8px 12px}
@media (max-width:600px){
  .mailbar{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .mailbar .opt{grid-column:1/-1}
  .mailbar .grow{display:none}
  .mailbar #mRefresh{grid-column:1/-1}
  .mail .ma{flex-wrap:nowrap}
  .mail .ma a{font-size:13.5px;white-space:nowrap}
  .mail .ma .btn{padding:8px 11px;font-size:13.5px;white-space:nowrap}
}

/* ---------- Feuilles ---------- */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:flex-end;justify-content:center;z-index:20}
.sheet.on{display:flex}
.panel{background:var(--card);width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:88dvh;overflow:auto}
@media (min-width:980px){.sheet{align-items:center}.panel{border-radius:18px;max-width:560px}}
.panel h3{margin:0 0 12px;font-size:16px}
.panel h4{margin:18px 0 6px;font-size:14px}
.panel label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
.panel input,.panel textarea,.panel select{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px;font:inherit}
.panel select{-webkit-appearance:none;appearance:none}
.panel textarea{min-height:70px;resize:vertical}
.panel .seg{margin-top:2px}
.panel p{font-size:14px;color:var(--muted);margin:6px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chips button,.actions button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:8px 12px;font-size:14px;cursor:pointer}
.actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.actions .primary{background:var(--accent);border-color:var(--accent);color:#fff;flex:1}
.actions .danger{color:var(--danger)}
.linkrow{display:flex;gap:10px;align-items:center;margin-top:4px}
.linkrow a{flex:1;min-width:0;font-size:14px;color:var(--accent);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.linkrow button{flex:none;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:6px 10px;font-size:13px;cursor:pointer}
.prop{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.prop:last-child{border-bottom:0}
.prop input[type=checkbox]{width:20px;height:20px;padding:0;margin-top:9px;accent-color:var(--accent);flex:none}
.prop .pbody{flex:1;min-width:0}
.prop .pmeta{font-size:12.5px;color:var(--muted);margin-top:4px}
.prop .dup{color:var(--late)}
.transcript{font-size:13px;color:var(--muted);background:var(--bg);border-radius:10px;padding:8px 10px;margin-bottom:6px;max-height:90px;overflow:auto}
.summary{white-space:pre-wrap;line-height:1.5;font-size:15px}
.pair{border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:10px}
.pair .pa{font-size:14px;margin-bottom:8px}
.autoinfo{margin-top:16px;padding-top:12px;border-top:1px solid var(--line);font-size:13.5px;color:var(--muted);line-height:1.5}
.autoinfo b{color:var(--ink);font-weight:600}
.autoinfo .warn{color:var(--late)}
.prow{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.prow .sw{width:26px;height:26px;border-radius:50%;border:0;flex:none;cursor:pointer}

.prow button.x{flex:none;border:1px solid var(--line);background:var(--bg);color:var(--danger);border-radius:10px;padding:8px 10px;font-size:13px;cursor:pointer}
.newp{display:flex;gap:8px;margin-top:12px}
.newp input{flex:1;min-width:0}
#inv{flex-wrap:wrap}#inv input{flex:1 1 160px}#inv button{min-height:42px}

.krow{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.krow .kl{flex:1;min-width:0}
.krow .kd{color:var(--muted);font-size:12.5px}
.krow button{flex:none;border:1px solid var(--line);background:var(--bg);color:var(--danger);border-radius:10px;padding:6px 10px;font-size:13px;cursor:pointer}
.secret{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;word-break:break-all;margin:6px 0}
.cbtn{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:4px 8px;font-size:12.5px;cursor:pointer}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0}

/* ---------- Connexion ---------- */
.login{max-width:400px;margin:12vh auto 0;padding:0 16px}
.login h1{font-size:30px;margin:0 0 6px;letter-spacing:-.02em}
.login p{color:var(--muted);margin:0 0 22px}
.login .lbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px;font-weight:600;cursor:pointer;margin-bottom:10px}
.login .or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;margin:16px 0}
.login .or::before,.login .or::after{content:"";flex:1;height:1px;background:var(--line)}
.login input{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px;font:inherit;margin-bottom:8px}
.login .go{width:100%;border:0;background:var(--accent);color:#fff;border-radius:12px;padding:12px;font-weight:600;cursor:pointer}
.login .err{color:var(--danger);font-size:14px;min-height:20px;margin-top:8px}
.login .note{font-size:12.5px;color:var(--muted);margin-top:18px}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;font-size:14px;display:none;gap:14px;align-items:center;z-index:30;width:max-content;max-width:min(92vw,520px)}
.toast.on{display:flex}
.toast button{border:0;background:transparent;color:var(--accent);font-weight:700;cursor:pointer;white-space:nowrap;flex:none}
#toastMsg{flex:1;min-width:0}
</style>
</head>
<body>
<div id="app"></div>
<div class="sheet" id="sheet"><div class="panel" id="panel"></div></div>
<div class="toast" id="toast"><span id="toastMsg"></span><button id="toastUndo">Annuler</button></div>

<script>
const API = "https://rorwnacthttwxyqemkgv.supabase.co/functions/v1/todo-api";
const APP = location.href.split("#")[0].split("?")[0];
const store = {
  get(k){ try{ return localStorage.getItem(k) }catch{ return null } },
  set(k,v){ try{ localStorage.setItem(k,v) }catch{} },
  del(k){ try{ localStorage.removeItem(k) }catch{} },
};
let token = store.get("todo_token");
let meInfo = null;
let view = store.get("todo_view") || "today";
let tasks = [], counts = {today:0,later:0,done:0,mail:0}, searching = false, overview = null, projects = [];
let fProject = store.get("todo_fproject") || "", fWho = store.get("todo_fwho") || "", newWho = "moi";
let mailData = null, mailTab = "nouveau";
const PALETTE = ["#1f8a9a","#2f8f5b","#6a4fd6","#c2417a","#c27a1f","#3b6fd1","#8a5a2b","#5b6b8a"];
const HINT = "Astuces : demain, vendredi, 15/10 · #projet · @agent pour confier à l'IA";
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const safeUrl = u => typeof u === "string" && /^https:\/\//.test(u);
const projById = id => projects.find(p => p.id === id);
const AGENT_LABEL = n => n === "claude" ? "Claude" : n === "chatgpt" ? "ChatGPT" : "Agent IA";
const isWide = () => matchMedia("(min-width:980px)").matches;
const legacy = () => !!meInfo?.legacy;

async function api(path, opts = {}){
  const headers = { "Content-Type": "application/json" };
  if (token) headers.Authorization = "Bearer " + token;
  const r = await fetch(API + path, { ...opts, headers });
  const data = await r.json().catch(() => ({}));
  if (r.status === 401 && token && !path.startsWith("/auth/")) { token = null; store.del("todo_token"); meInfo = null; showLogin("Session expirée, reconnecte-toi."); }
  if (!r.ok) throw Object.assign(new Error(data.error || "Erreur réseau"), { status: r.status, data });
  return data;
}

// ---------- Dates ----------
const todayISO = (o=0) => new Date(Date.now()+o*864e5).toLocaleDateString("en-CA");
function nextWeekday(target){ const w = new Date().getDay(); const d = (target - w + 7) % 7; return todayISO(d || 7); }
function fmtDue(iso){
  if (!iso) return "";
  const t = todayISO(0);
  if (iso < t) { const n = Math.round((Date.parse(t) - Date.parse(iso)) / 864e5); return `<span class="late">En retard de ${n} j</span>`; }
  if (iso === t) return "Aujourd'hui";
  if (iso === todayISO(1)) return "Demain";
  const diff = (Date.parse(iso) - Date.parse(t)) / 864e5;
  const s = new Date(iso + "T12:00:00").toLocaleDateString("fr-BE", diff < 7 ? { weekday:"long" } : { day:"numeric", month:"short" });
  return s.charAt(0).toUpperCase() + s.slice(1);
}
function fmtAgo(ts){
  const m = Math.round((Date.now() - Date.parse(ts)) / 6e4);
  if (m < 60) return `il y a ${Math.max(m,1)} min`;
  const h = Math.round(m/60); if (h < 24) return `il y a ${h} h`;
  const d = Math.round(h/24); if (d < 7) return `il y a ${d} j`;
  return new Date(ts).toLocaleDateString("fr-BE", { day:"numeric", month:"short" });
}

// ---------- Connexion ----------
function readHash(){
  const h = new URLSearchParams(location.hash.slice(1));
  const msg = {};
  if (h.get("session")) { token = h.get("session"); store.set("todo_token", token); }
  if (h.get("auth_error")) msg.auth = h.get("auth_error");
  if (h.get("mail") === "connected") msg.mail = "Boîte mail connectée";
  if (h.get("mail_error")) msg.mailErr = h.get("mail_error");
  if (location.hash) history.replaceState(null, "", APP);
  return msg;
}
async function showLogin(err){
  let prov = { google:false, microsoft:false };
  try { prov = await (await fetch(API + "/auth/providers")).json(); } catch {}
  const red = encodeURIComponent(APP);
  closeSheet();
  $("#app").innerHTML = `<div class="login">
    <h1>To Do</h1><p>Ta liste qui se vide toute seule quand c'est fait.</p>
    ${prov.google ? `<button class="lbtn" id="lg">Continuer avec Google</button>` : ""}
    ${prov.microsoft ? `<button class="lbtn" id="lm">Continuer avec Microsoft</button>` : ""}
    ${prov.google || prov.microsoft ? `<div class="or">ou</div>` : ""}
    <form id="kf"><input id="k" placeholder="Clé d'accès (todo_…)" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button class="go">Se connecter avec ma clé</button></form>
    <div class="err" id="lerr">${esc(err || "")}</div>
    <div class="note">${prov.google || prov.microsoft ? "" : "La connexion avec Google et Microsoft arrive bientôt. En attendant, utilise ta clé d'accès personnelle."}</div>
  </div>`;
  if ($("#lg")) $("#lg").onclick = () => location.href = `${API}/auth/google/start?redirect=${red}`;
  if ($("#lm")) $("#lm").onclick = () => location.href = `${API}/auth/microsoft/start?redirect=${red}`;
  $("#kf").onsubmit = async e => {
    e.preventDefault(); const key = $("#k").value.trim(); if (!key) return;
    try { const r = await api("/auth/key", { method:"POST", body: JSON.stringify({ key }) }); token = r.session; store.set("todo_token", token); boot(); }
    catch(x){ $("#lerr").textContent = x.status === 401 ? "Clé non reconnue." : x.message; }
  };
}
async function logout(){
  try { await api("/auth/logout", { method:"POST", body:"{}" }); } catch {}
  token = null; store.del("todo_token"); meInfo = null; closeSheet(); showLogin();
}

// ---------- Squelette ----------
function initials(){ return (meInfo?.user?.name || meInfo?.user?.email || "?").split(/[\s@.]+/).filter(Boolean).slice(0,2).map(s => s[0].toUpperCase()).join(""); }
function renderShell(){
  const d = new Date().toLocaleDateString("fr-BE", { weekday:"long", day:"numeric", month:"long" });
  $("#app").innerHTML = `<div class="app">
    <aside class="side" id="side"></aside>
    <main class="main">
      <header class="top"><div><h1>To Do</h1><div class="sub">${d}</div></div>
        <div class="hright"><button class="hbtn" id="sumBtn">Résumé</button><button class="avatar mob" id="acctBtn" aria-label="Compte">${legacy() ? "?" : esc(initials())}</button></div></header>
      <div id="banner"></div>
      <div id="addZone">
        <form class="add" id="add"><input id="new" placeholder="Nouvelle tâche…" enterkeyhint="done" autocomplete="off">
          <button type="button" class="mic" id="mic" aria-label="Dicter des tâches"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
          <button type="submit" aria-label="Ajouter">+</button></form>
        <div class="opts">
          <label class="opt"><span class="dot" id="nProjDot" style="background:var(--line)"></span><select id="nProj" aria-label="Projet de la nouvelle tâche"></select></label>
          <div class="seg" id="nWho" role="group" aria-label="Qui fait la tâche"><button type="button" data-w="moi" class="on">Moi</button><button type="button" data-w="agent" class="ag">Agent IA</button></div>
          <label class="opt"><span class="lbl">Échéance</span><input type="date" id="nDue" aria-label="Échéance"></label>
        </div>
        <div class="hint" id="hint">${HINT}</div>
      </div>
      <div class="asksWrap" id="asks"></div>
      <nav class="tabs mob" id="tabs"></nav>
      <div class="pfilter mob" id="pfilter"></div>
      <div class="vhead" id="vhead"></div>
      <div class="search" id="searchBox"><input id="q" type="search" placeholder="Rechercher dans toutes les tâches"></div>
      <div id="content"></div>
    </main>
    <aside class="aside" id="aside"></aside>
  </div>`;
  $("#add").onsubmit = onAdd;
  $("#q").oninput = debounce(onSearch, 250);
  $("#mic").onclick = toggleMic;
  $("#sumBtn").onclick = openSummary;
  $("#acctBtn").onclick = () => legacy() ? showLogin() : openAccount();
  $("#nProj").onchange = () => { if ($("#nProj").value === "__new") { $("#nProj").value = ""; openProjects(true); } renderNewProj(); };
  $$("#nWho button").forEach(b => b.onclick = () => { newWho = b.dataset.w; renderNewWho(); });
}
function renderNewWho(){ $$("#nWho button").forEach(b => b.classList.toggle("on", b.dataset.w === newWho)); }
function renderNewProj(){
  const sel = $("#nProj"); if (!sel) return;
  const cur = sel.value || (fProject && fProject !== "aucun" ? fProject : "");
  sel.innerHTML = `<option value="">Sans projet</option>` + projects.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join("") + `<option value="__new">+ Nouveau projet…</option>`;
  sel.value = projById(cur) ? cur : "";
  const p = projById(sel.value); $("#nProjDot").style.background = p ? p.color : "var(--line)";
}
function renderBanner(){
  const b = $("#banner");
  if (!legacy()) { b.innerHTML = ""; return; }
  b.innerHTML = `<div class="banner"><span><b>Mode ouvert.</b> Connecte-toi avec ta clé pour activer la section Mail et protéger tes tâches.</span><button id="bLogin">Se connecter</button></div>`;
  $("#bLogin").onclick = () => showLogin();
}

// ---------- Navigation ----------
const VIEWS = { today:"Aujourd'hui", later:"Plus tard", mail:"Mail", done:"Fait récemment", search:"Rechercher" };
const ICONS = { today:"☀", later:"→", mail:"✉", done:"✓", search:"⌕" };
function viewBadge(k){
  if (k === "mail") return counts.mail ? `<span class="n hot">${counts.mail}</span>` : "";
  const n = counts[k]; return n != null && k !== "search" ? `<span class="n">${n}</span>` : "";
}
function renderSide(){
  const s = $("#side"); if (!s) return;
  const cur = searching ? "search" : view;
  const who = [["","Tous"],["moi","Moi"],["agent","Agents IA"]];
  s.innerHTML = `<div class="brand"><span class="lg">✓</span><b>To Do</b></div>
    <div class="snav">${["today","later","mail","done","search"].map(k => `<button data-v="${k}" class="${cur===k?"on":""}"><span class="ic">${ICONS[k]}</span>${VIEWS[k]}${viewBadge(k)}</button>`).join("")}</div>
    <div class="stitle">Qui fait</div>
    <div class="swho">${who.map(([k,l]) => `<button data-w="${k}" class="${fWho===k?"on":""} ${k==="agent"?"ag":""}">${l}${k==="agent" && counts.agent ? ` ${counts.agent}`:""}</button>`).join("")}</div>
    <div class="stitle">Projets<button id="sManage" title="Gérer les projets">+</button></div>
    <div class="sproj">
      <button data-p="" class="${!fProject?"on":""}"><span class="dot" style="background:var(--muted)"></span><span class="nm">Tous les projets</span></button>
      ${projects.map(p => `<button data-p="${p.id}" class="${fProject===p.id?"on":""}"><span class="dot" style="background:${p.color}"></span><span class="nm">${esc(p.name)}</span>${p.open_count?`<span class="n">${p.open_count}</span>`:""}</button>`).join("")}
      <button data-p="aucun" class="${fProject==="aucun"?"on":""}"><span class="dot" style="background:var(--line)"></span><span class="nm">Sans projet</span></button>
    </div>
    <div class="sfoot">
      <button class="acct" id="sAcct"><span class="avatar" style="display:grid;place-items:center">${legacy() ? "?" : esc(initials())}</span>
        <span style="min-width:0"><div style="font-size:14px;font-weight:600">${legacy() ? "Mode ouvert" : esc(meInfo?.user?.name || "Mon compte")}</div><div class="em">${legacy() ? "Se connecter" : esc(meInfo?.user?.email || "")}</div></span></button>
    </div>`;
  $$("#side .snav button").forEach(b => b.onclick = () => setView(b.dataset.v));
  $$("#side .swho button").forEach(b => b.onclick = () => setWho(b.dataset.w));
  $$("#side .sproj button").forEach(b => b.onclick = () => setProject(b.dataset.p));
  $("#sManage").onclick = () => openProjects(false);
  $("#sAcct").onclick = () => legacy() ? showLogin() : openAccount();
}
function renderTabs(){
  const cur = searching ? "search" : view;
  $("#tabs").innerHTML = ["today","later","mail","done","search"].map(k => `<button data-v="${k}" class="${cur===k?"on":""}">${VIEWS[k]}${viewBadge(k)}</button>`).join("");
  $$("#tabs button").forEach(b => b.onclick = () => setView(b.dataset.v));
  const box = $("#pfilter");
  if (view === "mail" && !searching) { box.innerHTML = ""; return; }
  const who = [["","Tous"],["moi","Moi"],["agent",`Agents IA${counts.agent ? ` <span class="n">${counts.agent}</span>` : ""}`]];
  box.innerHTML = `<div class="seg">${who.map(([k,l]) => `<button type="button" data-w="${k}" class="${fWho===k?"on":""} ${k==="agent"?"ag":""}">${l}</button>`).join("")}</div><span class="sep"></span>` +
    `<button class="pf ${!fProject?"on":""}" data-p="">Tous les projets</button>` +
    projects.map(p => `<button class="pf ${fProject===p.id?"on":""}" data-p="${p.id}"><span class="dot" style="background:${p.color}"></span>${esc(p.name)}${p.open_count?` <span class="n">${p.open_count}</span>`:""}</button>`).join("") +
    `<button class="pf ${fProject==="aucun"?"on":""}" data-p="aucun">Sans projet</button><button class="pf" id="manageP">Projets…</button>`;
  $$("#pfilter .seg button").forEach(b => b.onclick = () => setWho(b.dataset.w));
  $$("#pfilter .pf[data-p]").forEach(b => b.onclick = () => setProject(b.dataset.p));
  $("#manageP").onclick = () => openProjects(false);
}
function renderHead(){
  const cur = searching ? "search" : view;
  const p = projById(fProject);
  const scope = [p ? p.name : fProject === "aucun" ? "Sans projet" : "", fWho === "agent" ? "Agents IA" : fWho === "moi" ? "Moi" : ""].filter(Boolean).join(" · ");
  $("#vhead").innerHTML = `<h2>${VIEWS[cur]}</h2>${cur !== "mail" && scope ? `<span class="sub">${esc(scope)}</span>` : ""}`;
  $("#addZone").style.display = cur === "mail" ? "none" : "";
}
function renderNav(){ renderSide(); renderTabs(); renderHead(); }
function setView(v){
  if (v === "search"){ searching = true; $("#searchBox").classList.add("on"); $("#q").focus(); tasks = []; renderNav(); renderList(); return; }
  searching = false; $("#searchBox").classList.remove("on"); $("#q").value = "";
  view = v; store.set("todo_view", v); load();
}
function setWho(w){ fWho = w; store.set("todo_fwho", w); if (view === "mail") { view = "today"; store.set("todo_view", view); } load(); }
function setProject(p){ fProject = p; store.set("todo_fproject", p); if ($("#nProj")) $("#nProj").value = ""; if (view === "mail") { view = "today"; store.set("todo_view", view); } load(); }

// ---------- Liste des tâches ----------
function renderList(){
  const ul = document.createElement("ul"); ul.id = "list";
  $("#content").replaceChildren(ul);
  if (!tasks.length){
    const msg = searching ? ["Aucun résultat",""] :
      view === "today" ? ["Rien pour aujourd'hui","Profite, ou avance sur Plus tard."] :
      view === "later" ? ["Rien de prévu","Ajoute une tâche en haut."] : ["Rien de fermé récemment",""];
    if (!searching && (fProject || fWho)) msg[1] = "Aucune tâche avec ce filtre.";
    ul.innerHTML = `<div class="empty"><b>${msg[0]}</b>${msg[1]}</div>`; return;
  }
  ul.innerHTML = tasks.map(t => {
    const meta = [];
    if (t.status === "open"){
      if (t.due_date) meta.push(fmtDue(t.due_date));
      if (t.pinned_today && view !== "today") meta.push("Épinglée");
      if (t.assignee === "agent") meta.push(`<span class="agtag">✦ ${AGENT_LABEL(t.agent_name)}</span>`);
      if (t.notes) meta.push(esc(t.notes.slice(0,80)));
    } else {
      meta.push(`Fermée ${fmtAgo(t.closed_at)}`);
      if (t.closed_by && t.closed_by !== "ben") meta.push(`<span class="auto">par ${t.closed_by === "auto" ? "l'IA" : "un agent"}</span>`);
      if (t.close_proof) meta.push(esc(t.close_proof));
    }
    const pr = projById(t.project_id);
    if (pr && fProject !== pr.id) meta.unshift(`<span class="ptag"><span class="dot" style="background:${pr.color}"></span>${esc(pr.name)}</span>`);
    const link = t.status === "open" && safeUrl(t.link_url) ? `<a class="tlink" href="${esc(t.link_url)}" target="_blank" rel="noopener">↗ ${esc(t.link_label || "Ouvrir le mail")}</a>` : "";
    return `<li data-id="${t.id}"><div class="bgR">✓ Fait</div><div class="bgL">Reporter →</div>
      <div class="row ${t.status === "done" ? "done":""}">
        <button class="check" aria-label="${t.status==="done"?"Rouvrir":"Terminer"}"></button>
        <div class="body"><div class="title">${esc(t.title)}</div>${meta.length?`<div class="meta">${meta.map(m=>`<span>${m}</span>`).join("")}</div>`:""}${link}</div>
        <button class="more" aria-label="Options">⋯</button></div></li>`;
  }).join("") + `<div class="foot mob">Glisse à droite pour terminer, à gauche pour reporter</div>`;
  ul.querySelectorAll("li").forEach(li => {
    const t = tasks.find(x => x.id === li.dataset.id);
    li.querySelector(".check").onclick = () => t.status === "done" ? reopen(t) : complete(t);
    li.querySelector(".more").onclick = () => openEdit(t);
    li.querySelector(".body").onclick = () => openEdit(t);
    li.querySelectorAll(".tlink").forEach(a => a.onclick = e => e.stopPropagation());
    if (t.status === "open") swipe(li, t);
  });
}

// ---------- C'est fait ? ----------
const SRC = { mail: "Mail", agenda: "Agenda", autre: "Preuve" };
function asksHtml(ps){
  if (!ps.length) return "";
  return `<div class="asksH">C'est fait ?<span class="n">${ps.length}</span>${overview?.mode === "simulation" ? `<span class="sim">Rien ne se ferme sans toi</span>` : ""}</div>` +
    ps.map(p => `<div class="ask" data-id="${p.id}"><div class="at">${esc(p.task_title)}</div>
      <div class="ap"><b>${SRC[p.source] || "Preuve"}</b> · ${esc(p.proof)}</div>
      <div class="ab"><span class="ac">Certitude ${Math.round(p.confidence * 100)} %</span><button class="no">Non</button><button class="yes">Oui, fermer</button></div></div>`).join("");
}
function bindAsks(root, ps){
  root.querySelectorAll(".ask").forEach(el => {
    const p = ps.find(x => x.id === el.dataset.id);
    el.querySelector(".yes").onclick = () => decide(p, true, el);
    el.querySelector(".no").onclick = () => decide(p, false, el);
  });
}
function renderAsks(){
  const ps = overview?.pending || [];
  const box = $("#asks"); box.innerHTML = view === "mail" ? "" : asksHtml(ps); bindAsks(box, ps);
  const a = $("#aside"); if (!a) return;
  const top = view === "mail" && mailTab !== "nouveau" ? [] : (mailData?.items || []).filter(m => m.status === "nouveau" && m.priority >= 70).slice(0, 5);
  a.innerHTML = (ps.length ? asksHtml(ps) : `<div class="asksH">C'est fait ?</div><div class="calm">Aucune clôture à valider. La vérification passe chaque heure.</div>`) +

let rec = null, recChunks = [], recStream = null, recTimer = null, recSec = 0;
async function toggleMic(){
  const btn = $("#mic");
  if (rec && rec.state === "recording") { rec.stop(); return; }
  if (btn.classList.contains("busy")) return;
  try { recStream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch(e){ toast("Micro inaccessible : autorise-le dans les réglages du navigateur"); return; }
  const mime = ["audio/webm","audio/mp4","audio/ogg"].find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || "";
  rec = new MediaRecorder(recStream, mime ? { mimeType: mime } : undefined); recChunks = [];
  rec.ondataavailable = e => { if (e.data.size) recChunks.push(e.data); };
  rec.onstop = onRecStop;
  rec.start(); btn.classList.add("rec"); recSec = 0;
  $("#hint").textContent = "Enregistrement 0:00 · touche à nouveau le micro pour terminer";
  recTimer = setInterval(() => { recSec++; $("#hint").textContent = `Enregistrement ${Math.floor(recSec/60)}:${String(recSec%60).padStart(2,"0")} · touche à nouveau le micro pour terminer`; if (recSec >= 180) rec.stop(); }, 1000);
}
async function onRecStop(){
  clearInterval(recTimer); recStream?.getTracks().forEach(t => t.stop());
  const btn = $("#mic"); btn.classList.remove("rec"); btn.classList.add("busy");
  $("#hint").textContent = "Transcription en cours…";
  try {
    const blob = new Blob(recChunks, { type: rec.mimeType || "audio/webm" });
    const ext = (rec.mimeType || "").includes("mp4") ? "m4a" : (rec.mimeType || "").includes("ogg") ? "ogg" : "webm";

        <div class="chips"><button data-k="${i}" data-w="a">Garder la 1re</button><button data-k="${i}" data-w="b">Garder la 2e</button><button data-k="${i}" data-w="x">Ce n'est pas un doublon</button></div></div>`).join("") : ""}
      <div class="actions"><button class="primary" id="cancel">Fermer</button></div>`;
    $("#cancel").onclick = closeSheet;
    $("#panel").querySelectorAll(".pair button").forEach(b => b.onclick = async () => {
      const d = s.doublons[+b.dataset.k], pair = b.closest(".pair");
      if (b.dataset.w === "x") { pair.remove(); return; }
      const drop = b.dataset.w === "a" ? d.b : d.a;
      try { await api(`/tasks/${drop.id}`, { method:"DELETE" }); pair.remove(); toast(`Supprimée : « ${drop.title} »`); load(); } catch(e){ toast(e.message); }
    });
  } catch(e){ $("#panel").querySelector(".summary").textContent = e.message; }
}
async function onSearch(){
  const q = $("#q").value.trim(); if (!q){ tasks = []; renderList(); return; }
  try { tasks = await api("/search?q=" + encodeURIComponent(q)); renderList(); } catch(e){ toast(e.message); }
}
async function complete(t){
  tasks = tasks.filter(x => x.id !== t.id); renderList();
  try { await api(`/tasks/${t.id}/complete`, { method:"POST", body:"{}" }); toast("Terminée", () => reopen(t)); load(); }
  catch(e){ toast(e.message); load(); }
}
async function reopen(t){ try { await api(`/tasks/${t.id}/reopen`, { method:"POST", body:"{}" }); toast("Rouverte"); load(); } catch(e){ toast(e.message); } }
async function patch(t, body, msg){ try { await api(`/tasks/${t.id}`, { method:"PATCH", body: JSON.stringify(body) }); closeSheet(); if (msg) toast(msg); load(); } catch(e){ toast(e.message); } }
let confirmDelete = false;
async function remove(t){
  if (!confirmDelete) { confirmDelete = true; $("#del").textContent = "Confirmer la suppression"; return; }
  try { await api(`/tasks/${t.id}`, { method:"DELETE" }); closeSheet(); toast("Supprimée"); load(); } catch(e){ toast(e.message); }
}

// ---------- Report et édition ----------
function postponeOptions(){ return [["Aujourd'hui", todayISO(0)],["Demain", todayISO(1)],["Lundi", nextWeekday(1)],["Dans 1 semaine", todayISO(7)],["Sans date", null]]; }
function openPostpone(t){
  $("#panel").innerHTML = `<h3>Reporter « ${esc(t.title)} »</h3><div class="chips">${postponeOptions().map(([l],i)=>`<button data-i="${i}">${l}</button>`).join("")}</div>
    <label>Date précise</label><input type="date" id="pd" value="${t.due_date||""}">
    <div class="actions"><button id="cancel">Fermer</button><button class="primary" id="ok">Valider la date</button></div>`;
  $("#panel").querySelectorAll(".chips button").forEach(b => b.onclick = () => { const [l,d] = postponeOptions()[+b.dataset.i]; patch(t, { due_date: d, pinned_today: false }, `Reportée · ${l}`); });
  $("#ok").onclick = () => patch(t, { due_date: $("#pd").value || null, pinned_today:false }, "Date modifiée");
  $("#cancel").onclick = closeSheet; openSheet();
}
function openEdit(t){
  confirmDelete = false;
  const open = t.status === "open";
  $("#panel").innerHTML = `<h3>${open ? "Modifier" : "Tâche fermée"}</h3>
    <label>Titre</label><input id="et" value="${esc(t.title)}">
    <label>Notes</label><textarea id="en">${esc(t.notes||"")}</textarea>
    <label>Échéance</label><input type="date" id="ed" value="${t.due_date||""}">
    <label>Projet</label><select id="eproj"><option value="">Sans projet</option>${projects.map(p => `<option value="${p.id}" ${p.id===t.project_id?"selected":""}>${esc(p.name)}</option>`).join("")}</select>
    <label>Qui fait la tâche</label><div class="seg" id="ewho"><button type="button" data-w="moi" class="${t.assignee!=="agent"?"on":""}">Moi</button><button type="button" data-w="agent" class="ag ${t.assignee==="agent"?"on":""}">Agent IA</button></div>
    ${safeUrl(t.link_url) ? `<label>Mail lié</label><div class="linkrow"><a href="${esc(t.link_url)}" target="_blank" rel="noopener">↗ ${esc(t.link_label || "Ouvrir le mail")}</a><button id="unlink">Retirer</button></div>` : ""}
    ${open ? `<div class="chips" style="margin-top:12px"><button id="pin">${t.pinned_today ? "Retirer d'Aujourd'hui" : "Épingler dans Aujourd'hui"}</button><button id="pp">Reporter…</button></div>` : ""}
    <div class="actions"><button class="danger" id="del">Supprimer</button>${open ? `<button id="cmp">Terminer</button>` : `<button id="rop">Rouvrir</button>`}<button class="primary" id="save">Enregistrer</button></div>`;
  let ewho = t.assignee === "agent" ? "agent" : "moi";
  $$("#ewho button").forEach(b => b.onclick = () => { ewho = b.dataset.w; $$("#ewho button").forEach(x => x.classList.toggle("on", x === b)); });
  $("#save").onclick = () => patch(t, { title: $("#et").value.trim() || t.title, notes: $("#en").value.trim() || null, due_date: $("#ed").value || null, project_id: $("#eproj").value || null, assignee: ewho }, "Enregistrée");
  $("#del").onclick = () => remove(t);
  if ($("#unlink")) $("#unlink").onclick = () => patch(t, { link_url: null }, "Lien retiré");
  if (open){
    $("#pin").onclick = () => patch(t, { pinned_today: !t.pinned_today }, t.pinned_today ? "Retirée d'Aujourd'hui" : "Épinglée");
    $("#pp").onclick = () => openPostpone(t);
    $("#cmp").onclick = () => { closeSheet(); complete(t); };
  } else $("#rop").onclick = () => { closeSheet(); reopen(t); };
  openSheet();
}

// ---------- Projets ----------
let delArm = null;
function openProjects(focusNew){
  delArm = null;
  $("#panel").innerHTML = `<h3>Projets</h3>
    <div id="plist">${projects.length ? projects.map(p => `<div class="prow" data-id="${p.id}">
      <button class="sw" style="background:${p.color}" aria-label="Changer la couleur"></button>
      <input value="${esc(p.name)}" aria-label="Nom du projet" maxlength="60"><span class="pc">${p.open_count || 0}</span>
      <button class="x">Supprimer</button></div>`).join("") : `<div class="empty" style="padding:16px">Aucun projet pour l'instant.</div>`}</div>
    <form class="newp" id="newp"><input id="np" placeholder="Nouveau projet" maxlength="60" autocomplete="off"><button>Créer</button></form>
    <div class="hint">Supprimer un projet garde ses tâches, sans projet.</div>
    <div class="actions"><button class="primary" id="cancel">Fermer</button></div>`;
  $("#cancel").onclick = () => { closeSheet(); load(); };
  $("#newp").onsubmit = async e => {
    e.preventDefault(); const name = $("#np").value.trim(); if (!name) return;
    try { const p = await api("/projects", { method:"POST", body: JSON.stringify({ name }) }); projects.push(p); toast(`Projet créé : ${p.name}`); renderNewProj(); $("#nProj").value = p.id; renderNewProj(); openProjects(false); }
    catch(err){ toast(err.message); }
  };
  $("#plist").querySelectorAll(".prow").forEach(row => {
    const p = projById(row.dataset.id);
    row.querySelector(".sw").onclick = async () => {
      const color = PALETTE[(PALETTE.indexOf(p.color) + 1) % PALETTE.length];
      try { await api(`/projects/${p.id}`, { method:"PATCH", body: JSON.stringify({ color }) }); p.color = color; row.querySelector(".sw").style.background = color; } catch(err){ toast(err.message); }
    };
    const inp = row.querySelector("input");
    inp.onchange = async () => {
      const name = inp.value.trim(); if (!name || name === p.name) { inp.value = p.name; return; }
      try { await api(`/projects/${p.id}`, { method:"PATCH", body: JSON.stringify({ name }) }); p.name = name; toast("Projet renommé"); } catch(err){ toast(err.message); inp.value = p.name; }
    };
    const x = row.querySelector(".x");
    x.onclick = async () => {
      if (delArm !== p.id) { delArm = p.id; x.textContent = "Confirmer"; return; }
      try { await api(`/projects/${p.id}`, { method:"DELETE" }); projects = projects.filter(q => q.id !== p.id); if (fProject === p.id) { fProject = ""; store.set("todo_fproject", ""); } toast(`Projet supprimé : ${p.name}`); openProjects(false); }
      catch(err){ toast(err.message); }
    };
  });
  openSheet();
  if (focusNew) setTimeout(() => $("#np")?.focus(), 50);
}

// ---------- Compte et clés ----------
async function openAccount(){
  if (legacy()) return showLogin();
  const u = meInfo.user;
  $("#panel").innerHTML = `<h3>Mon compte</h3><p><b style="color:var(--ink)">${esc(u.name || "")}</b> ${esc(u.email)}</p>
    <h4>Clés d'accès</h4><p>Pour Siri, Claude, ChatGPT ou un autre appareil. Une clé donne accès à toute ta liste : garde-la pour toi.</p>
    <div id="klist"><p>Chargement…</p></div>
    <form class="newp" id="newk"><input id="kl" placeholder="Nom de la clé (ex. Siri iPhone)" maxlength="60"><button>Créer</button></form>
    <div id="knew"></div>
    ${u.role === "admin" ? `<h4>Accès sans connexion</h4><div class="toggle"><span style="font-size:14px">${meInfo.legacy_open ? "Ouvert : l'ancienne app et Siri sans clé voient ta liste." : "Fermé : seule une connexion ou une clé donne accès."}</span>
      <button class="btn" id="legacyBtn">${meInfo.legacy_open ? "Fermer" : "Rouvrir"}</button></div>
      <h4>Inviter quelqu'un</h4><p>Crée un compte séparé : la personne aura sa propre liste, invisible pour toi, et toi pour elle.</p>
      <form class="newp" id="inv"><input id="ie" type="email" placeholder="E-mail" required><input id="in" placeholder="Prénom (optionnel)" maxlength="80"><button>Inviter</button></form>
      <div id="inew"></div>` : ""}
    <div class="actions"><button class="danger" id="lo">Se déconnecter</button><button class="primary" id="cancel">Fermer</button></div>`;
  $("#cancel").onclick = closeSheet;
  $("#lo").onclick = logout;
  if ($("#legacyBtn")) $("#legacyBtn").onclick = async () => {
    try { const r = await api("/admin/legacy", { method:"POST", body: JSON.stringify({ open: !meInfo.legacy_open }) }); meInfo.legacy_open = r.legacy_open; toast(r.legacy_open ? "Accès sans connexion rouvert" : "Accès sans connexion fermé"); openAccount(); }
    catch(e){ toast(e.message); }
  };
  if ($("#inv")) $("#inv").onsubmit = async e => {
    e.preventDefault();
    try {
      const r = await api("/admin/users", { method:"POST", body: JSON.stringify({ email: $("#ie").value.trim(), name: $("#in").value.trim() }) });
      $("#ie").value = ""; $("#in").value = "";
      const msg = `Voici ton accès à la To Do :\n1. Ouvre ${APP}\n2. Colle cette clé et clique « Se connecter avec ma clé » :\n${r.key}\nGarde-la pour toi, elle donne accès à ta liste.`;
      $("#inew").innerHTML = `<p style="color:var(--ink);margin-top:12px"><b>Compte créé pour ${esc(r.user.email)}.</b> Envoie-lui ce message, la clé ne sera plus affichée.</p>
        <div class="secret" style="white-space:pre-wrap">${esc(msg)}</div><button class="cbtn" data-c="${esc(msg)}">Copier le message</button>`;
      $$("#inew .cbtn").forEach(b => b.onclick = async () => { try { await navigator.clipboard.writeText(b.dataset.c); toast("Copié"); } catch { toast("Copie impossible, sélectionne le texte"); } });
    } catch(e){ toast(e.message); }
  };
  $("#newk").onsubmit = async e => {
    e.preventDefault();
    try {
      const k = await api("/keys", { method:"POST", body: JSON.stringify({ label: $("#kl").value.trim() || "Clé" }) });
      $("#kl").value = "";
      $("#knew").innerHTML = `<p style="color:var(--ink);margin-top:12px"><b>Copie-la maintenant, elle ne sera plus affichée.</b></p>
        <div class="secret">${esc(k.key)}</div><button class="cbtn" data-c="${esc(k.key)}">Copier la clé</button>
        <p>Siri (raccourci, action « Obtenir le contenu de l'URL ») :</p><div class="secret">${esc(API)}/voice?key=${esc(k.key)}</div><button class="cbtn" data-c="${esc(API)}/voice?key=${esc(k.key)}">Copier</button>
        <p>Claude ou ChatGPT (connecteur MCP) :</p><div class="secret">${esc(API)}/mcp/${esc(k.key)}</div><button class="cbtn" data-c="${esc(API)}/mcp/${esc(k.key)}">Copier</button>`;
      $$("#knew .cbtn").forEach(b => b.onclick = async () => { try { await navigator.clipboard.writeText(b.dataset.c); toast("Copié"); } catch { toast("Copie impossible, sélectionne le texte"); } });
      loadKeys();
    } catch(e){ toast(e.message); }
  };
  openSheet(); loadKeys();
}
async function loadKeys(){
  try {
    const ks = await api("/keys");
    $("#klist").innerHTML = ks.length ? ks.map(k => `<div class="krow"><div class="kl">${esc(k.label)}<div class="kd">créée ${fmtAgo(k.created_at)}${k.last_used_at ? ` · utilisée ${fmtAgo(k.last_used_at)}` : ""}</div></div><button data-k="${k.id}">Révoquer</button></div>`).join("") : `<p>Aucune clé.</p>`;
    $$("#klist button").forEach(b => b.onclick = async () => {
      if (b.textContent !== "Confirmer") { b.textContent = "Confirmer"; return; }
      try { await api(`/keys/${b.dataset.k}`, { method:"DELETE" }); toast("Clé révoquée"); loadKeys(); } catch(e){ toast(e.message); }
    });
  } catch(e){ $("#klist").innerHTML = `<p>${esc(e.message)}</p>`; }
}

function openSheet(){ $("#toast").classList.remove("on"); $("#sheet").classList.add("on"); }
function closeSheet(){ $("#sheet").classList.remove("on"); $("#panel").classList.remove("read"); }
$("#sheet").onclick = e => { if (e.target.id === "sheet") { closeSheet(); if ($("#plist")) load(); } };

// ---------- Glisser ----------
function swipe(li, t){
  const row = li.querySelector(".row"); let x0=0, y0=0, dx=0, active=false, locked=false;
  row.addEventListener("pointerdown", e => { if (e.pointerType === "mouse") return; x0=e.clientX; y0=e.clientY; dx=0; active=true; locked=false; row.style.transition="none"; });
  row.addEventListener("pointermove", e => {
    if (!active) return; const ddx = e.clientX-x0, ddy = e.clientY-y0;
    if (!locked){ if (Math.abs(ddy) > 10 && Math.abs(ddy) > Math.abs(ddx)) { active=false; row.style.transition=""; return; } if (Math.abs(ddx) > 10) { locked=true; row.setPointerCapture(e.pointerId); } }
    if (locked){ dx = ddx; row.style.transform = `translateX(${dx}px)`; li.querySelector(".bgR").style.opacity = dx>0?1:0; li.querySelector(".bgL").style.opacity = dx<0?1:0; }
  });
  const end = () => {
    if (!active) return; active=false; row.style.transition="";
    const w = row.offsetWidth * .3;
    if (dx > w){ row.style.transform = `translateX(100%)`; setTimeout(() => complete(t), 150); }
    else if (dx < -w){ row.style.transform = ""; openPostpone(t); }
    else row.style.transform = "";
  };
  row.addEventListener("pointerup", end); row.addEventListener("pointercancel", end);
}

// ---------- Divers ----------
let toastTimer;
function toast(msg, undo, label){
  $("#toastMsg").textContent = msg; const b = $("#toastUndo");
  b.textContent = label || "Annuler";
  b.style.display = undo ? "" : "none"; b.onclick = () => { $("#toast").classList.remove("on"); undo && undo(); };
  $("#toast").classList.add("on"); clearTimeout(toastTimer); toastTimer = setTimeout(() => $("#toast").classList.remove("on"), undo ? 7000 : 5000);
}
function debounce(f, ms){ let t; return (...a) => { clearTimeout(t); t = setTimeout(() => f(...a), ms); }; }
document.addEventListener("visibilitychange", () => { if (!document.hidden && !searching && meInfo && $("#content")) load(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); if (e.key === "n" && document.activeElement === document.body) { e.preventDefault(); $("#new")?.focus(); } });
matchMedia("(min-width:980px)").addEventListener?.("change", () => meInfo && $("#content") && load());

async function boot(){
  const msg = readHash();
  store.del("todo_key");
  try { meInfo = await api("/me"); }
  catch(e){ meInfo = null; return showLogin(msg.auth || ""); }
  if (msg.mail || msg.mailErr) { view = "mail"; store.set("todo_view", "mail"); }
  renderShell(); renderBanner(); renderNav(); load();
  if (msg.mail) toast(msg.mail);
  if (msg.mailErr) toast("Connexion de la boîte impossible : " + msg.mailErr);
  if (msg.auth) toast(msg.auth);
}
boot();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js", { scope: "./" }).catch(()=>{});
